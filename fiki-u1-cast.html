<header><img class="logo" src="icon-192.png" alt="AUDIO GELA"><div><div class="eyebrow">FIKI · 2.º ESO · Unidad 1</div><h1>Materia y medida</h1><div class="header-bottom"><span class="muted">Física y Química · 2026/27</span><a id="language-link" class="lang-link" href="fiki-u1-eus.html">Euskara →</a></div></div></header>
<nav class="tabs" id="tabs" aria-label="Secciones de estudio"></nav><div id="content"></div><noscript><p>Activa JavaScript para utilizar la autoevaluación y los ejercicios.</p><h2>La materia y sus cambios</h2><audio controls src="fiki-u1-01-cast.mp3"></audio><p>La ciencia busca explicar lo que ocurre mediante pruebas. Una afirmación científica debe poder contrastarse con observaciones o experimentos. Medir, comparar y repetir una experiencia ayuda a comprobar los resultados. Las ciencias físicas estudian, entre otros aspectos, la materia y la energía; las biológicas estudian los seres vivos; y las sociales, las sociedades y su comportamiento.</p><p>La Física y la Química son dos ciencias relacionadas. La Física estudia fenómenos como el movimiento, el calor o los cambios de estado. La Química estudia la composición de las sustancias y las transformaciones que producen sustancias diferentes. La pregunta clave para distinguir un cambio físico de uno químico es: ¿se forman sustancias nuevas?</p><p>Cuando un cubito de hielo se derrite, cambia de estado, pero sigue siendo agua. Es un cambio físico. Cortar un papel también es un cambio físico: cambia su forma, no la sustancia. Quemar el papel es un cambio químico, porque aparecen sustancias nuevas, como gases y cenizas. Algunos cambios físicos son reversibles, pero la reversibilidad por sí sola no sirve como regla absoluta. En una vela encendida hay dos procesos: la cera se funde, cambio físico, y parte de ella arde, cambio químico.</p><p>La materia tiene masa y ocupa un volumen. El aire, aunque no lo veamos, es materia: ocupa espacio y tiene masa. Un globo con aire tiene más masa que ese mismo globo sin aire. Son materia un lápiz, el dióxido de carbono, el humo, el agua de un río, la arena y el algodón. La luz, el sonido y la pereza no son materia. La música transmite energía; no es una sustancia. Un archivo digital es información, aunque el dispositivo que lo almacena sí está hecho de materia.</p><p>En el temario distinguimos cuerpos materiales y sistemas materiales. Un cuerpo tiene límites definidos, como un libro, un cubito de hielo o una silla. Para líquidos y gases usamos ejemplos de sistemas materiales, como el zumo, el aire o la atmósfera. Un recipiente puede delimitar un líquido o un gas; no debemos confundir el recipiente con su contenido.</p><p>Para repasar, prueba estas tres preguntas antes de seguir. ¿Es materia el aire? Sí, tiene masa y ocupa volumen. ¿Es químico derretir hielo? No, sigue siendo agua. ¿Qué cambia cuando quemamos papel? Su composición: aparecen sustancias nuevas. Explicar el criterio es tan importante como acertar el nombre.</p><h2>Las propiedades de la materia</h2><audio controls src="fiki-u1-02-cast.mp3"></audio><p>Las propiedades permiten describir y comparar la materia. No todas aportan la misma información. En esta unidad utilizamos tres clasificaciones distintas. Una misma propiedad recibe una etiqueta de cada clasificación: no hay que elegir entre cuantitativa, intensiva y característica, porque responden a preguntas diferentes.</p><p>Primera pregunta: ¿se expresa con un número y una unidad, o describe una cualidad? Las propiedades cuantitativas se pueden medir: masa, volumen, temperatura o densidad. Las cualitativas describen aspectos como el color o la suavidad. Decir que una tela es blanca describe una cualidad. Decir que su longitud es de ciento cincuenta centímetros da una medida.</p><p>Segunda pregunta: ¿depende de la cantidad de materia? Las propiedades extensivas dependen de ella. Al duplicar una muestra homogénea, se duplican su masa y su volumen. Las propiedades intensivas no dependen de la cantidad. Si dividimos agua a la misma temperatura, cada parte mantiene esa temperatura y la misma densidad. Comparamos siempre muestras en las mismas condiciones.</p><p>Tercera pregunta: ¿sirve para ayudar a identificar una sustancia? Las propiedades generales, como masa y volumen, no bastan para identificarla. Dos materiales distintos pueden tener la misma masa. Las propiedades características, como densidad, solubilidad, dureza y temperatura de ebullición, ayudan a distinguir sustancias. Algunas dependen de las condiciones: por ejemplo, la temperatura de ebullición cambia con la presión.</p><p>Siguiendo la clasificación del temario: la temperatura es cuantitativa, intensiva y general. El color y la suavidad son cualitativos, intensivos y generales. La temperatura de ebullición es cuantitativa, intensiva y característica. La dureza se trata como cuantitativa, intensiva y característica, porque puede compararse mediante escalas. La densidad y la solubilidad son cuantitativas, intensivas y características. El volumen es cuantitativo, extensivo y general.</p><p>No confundas temperatura con temperatura de ebullición. La primera indica el estado térmico de la muestra en ese momento; la segunda señala a qué temperatura hierve una sustancia bajo una presión determinada. Una botella y un vaso de la misma agua pueden tener distinto volumen y la misma densidad.</p><p>Método para responder: primero comprueba si hay medida o cualidad; después piensa qué pasaría al partir la muestra; por último decide si la propiedad ayuda a identificar la sustancia. Así puedes justificar cada etiqueta sin memorizar una lista de palabras sin sentido.</p><h2>Medir y convertir unidades</h2><audio controls src="fiki-u1-03-cast.mp3"></audio><p>Una magnitud es una propiedad que se puede medir. Medir consiste en comparar con una unidad de referencia. Una medida completa incluye un número y una unidad: decir cinco no basta; cinco metros describe una longitud. Elegimos el instrumento apropiado: una regla para longitud, una balanza para masa, un cronómetro para tiempo y un termómetro para temperatura.</p><p>El Sistema Internacional permite comunicar medidas con unidades compartidas. Sus siete unidades básicas son: metro para longitud, kilogramo para masa, segundo para tiempo, kelvin para temperatura, amperio para intensidad de corriente eléctrica, mol para cantidad de sustancia y candela para intensidad luminosa. El símbolo del kelvin es K, sin signo de grados. Los símbolos no llevan plural: escribimos kg, no kgs. El volumen, la superficie y la densidad son magnitudes derivadas. En el Sistema Internacional se expresan en metros cúbicos, metros cuadrados y kilogramos por metro cúbico.</p><p>Para las conversiones trabajaremos con kilo, hecto, deca, unidad, deci, centi y mili. En una escala de longitud, masa o capacidad, cada paso hacia una unidad menor multiplica por diez. Hacia una unidad mayor divide por diez. De kilogramos a gramos hay tres pasos: multiplicamos por mil. De kilogramos a miligramos hay seis: multiplicamos por un millón. Por eso cero coma cero ocho kilogramos equivalen a ochenta mil miligramos.</p><p>En superficies cada paso multiplica o divide por cien. Un metro cuadrado contiene diez mil centímetros cuadrados, porque un metro tiene cien centímetros y cien por cien es diez mil. Ocho mil cuatrocientos cincuenta y seis centímetros cuadrados son cero coma ocho cuatro cinco seis metros cuadrados. No uses el factor cien de longitud para convertir metros cuadrados a centímetros cuadrados.</p><p>En volúmenes cúbicos cada paso multiplica o divide por mil. Un metro cúbico equivale a mil decímetros cúbicos y a un millón de centímetros cúbicos. Aquí la escala tiene tres dimensiones. No confundas un metro, un metro cuadrado y un metro cúbico: miden magnitudes distintas.</p><p>El litro es una unidad de capacidad que usamos habitualmente. Un litro equivale exactamente a un decímetro cúbico. Un mililitro equivale a un centímetro cúbico. Un metro cúbico equivale a mil litros. Así, ochocientos setenta y cinco mililitros equivalen a cero coma ocho siete cinco decímetros cúbicos. Para pasar de decámetros cúbicos a litros, primero puedes pasar a metros cúbicos y luego a litros: siete coma cinco decámetros cúbicos son siete mil quinientos metros cúbicos, es decir, siete millones quinientos mil litros.</p><p>Para ordenar medidas, convierte todas a una misma unidad antes de comparar. Ocho coma dos decámetros son ochenta y dos metros; doscientos cincuenta y cuatro centímetros son dos coma cinco cuatro metros; cero coma cero cero cero tres kilómetros son cero coma tres metros. El mayor es el primero, después el segundo y después el tercero.</p><p>En cada ejercicio escribe la equivalencia, calcula y añade la unidad final. Comprueba si el número debe aumentar o disminuir. Una unidad menor exige más unidades para describir la misma cantidad. El cambio de unidad no cambia la cantidad real.</p><h2>Densidad y flotación</h2><audio controls src="fiki-u1-04-cast.mp3"></audio><p>¿Qué tiene más masa, un kilogramo de hierro o mil gramos de plumas? Tienen la misma masa. Lo que cambia es el volumen que ocupan. Las plumas ocupan mucho más espacio. Para comparar cuánto material hay en un mismo volumen usamos la densidad.</p><p>La densidad es la masa dividida entre el volumen: densidad igual a masa entre volumen. Si dos cajas tienen el mismo volumen y una contiene cinco kilogramos mientras la otra contiene veinte, la segunda tiene cuatro veces más densidad media. Si solo conocemos las masas y no los volúmenes, no podemos decidir cuál tiene más densidad.</p><p>La densidad es cuantitativa, intensiva y característica. En una sustancia homogénea, bajo las mismas condiciones, no cambia por tomar una muestra mayor. Al duplicar masa y volumen a la vez, el cociente se mantiene. La unidad del Sistema Internacional es el kilogramo por metro cúbico. También usaremos gramos por centímetro cúbico. Un gramo por centímetro cúbico equivale a mil kilogramos por metro cúbico.</p><p>Vamos a calcular. Una muestra tiene cuarenta gramos de masa y veinte centímetros cúbicos de volumen. Dividimos cuarenta entre veinte: su densidad es dos gramos por centímetro cúbico. Si conocemos densidad y volumen, multiplicamos: masa igual a densidad por volumen. Una sustancia de densidad dos gramos por centímetro cúbico que ocupa treinta centímetros cúbicos tiene sesenta gramos de masa. Si conocemos masa y densidad, dividimos: volumen igual a masa entre densidad. Sesenta gramos divididos entre dos gramos por centímetro cúbico dan treinta centímetros cúbicos.</p><p>Antes de operar, revisa las unidades. No dividas sin más una masa en kilogramos entre un volumen en centímetros cúbicos si te piden gramos por centímetro cúbico. Convierte la masa a gramos, o transforma ambas magnitudes a las unidades del Sistema Internacional. Un kilogramo y quinientos centímetros cúbicos corresponden a mil gramos divididos entre quinientos: dos gramos por centímetro cúbico.</p><p>La flotación depende de comparar la densidad media del objeto con la del fluido. En un modelo sencillo, un objeto menos denso que el agua flota y uno más denso se hunde. Si tienen igual densidad, puede quedar suspendido. El hielo es menos denso que el agua líquida y por eso flota. El aceite habitual es menos denso que el agua; además, no se mezcla con ella, de modo que queda encima.</p><p>No basta con decir que un objeto pesado se hunde. Un barco puede tener mucha masa y flotar porque su volumen exterior incluye espacios con aire y su densidad media es baja. Lo importante es la relación entre masa y volumen. Al terminar, comprueba la fórmula, las unidades y si el resultado tiene sentido.</p></noscript>
