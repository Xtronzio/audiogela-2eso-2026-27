<header><img class="logo" src="icon-192.png" alt="AUDIO GELA"><div><div class="eyebrow">FIKI · DBH 2 · 1. unitatea</div><h1>Materia eta neurketa</h1><div class="header-bottom"><span class="muted">Fisika eta Kimika · 2026/27</span><a id="language-link" class="lang-link" href="fiki-u1-cast.html">Castellano →</a></div></div></header>
<nav class="tabs" id="tabs" aria-label="Ikasteko atalak"></nav><div id="content"></div><noscript><p>Aktibatu JavaScript autoebaluazioa eta ariketak erabiltzeko.</p><h2>Materia eta haren aldaketak</h2><audio controls src="fiki-u1-01-eus.mp3"></audio><p>Zientziak gertatzen dena frogen bidez azaldu nahi du. Baieztapen zientifiko bat behaketen edo esperimentuen bidez egiaztatu ahal izan behar da. Neurtzeak, alderatzeak eta esperimentua errepikatzeak emaitzak egiaztatzen laguntzen dute. Zientzia fisikoek materia eta energia aztertzen dituzte, besteak beste. Zientzia biologikoek izaki bizidunak aztertzen dituzte; gizarte zientziek, gizarteak eta haien portaera.</p><p>Fisika eta Kimika elkarrekin lotutako bi zientzia dira. Fisikak mugimendua, beroa eta egoera aldaketak bezalako fenomenoak aztertzen ditu. Kimikak substantzien osaera eta substantzia berriak sortzen dituzten eraldaketak aztertzen ditu. Aldaketa fisikoa eta kimikoa bereizteko galdera nagusia hau da: substantzia berririk sortzen al da?</p><p>Izotz kubo bat urtzen denean, egoera aldatzen da, baina ura izaten jarraitzen du. Aldaketa fisikoa da. Papera moztea ere aldaketa fisikoa da: forma aldatzen da, ez substantzia. Papera erretzea aldaketa kimikoa da, gasak eta errautsak bezalako substantzia berriak sortzen direlako. Aldaketa fisiko batzuk itzulgarriak dira, baina itzulgarritasuna bakarrik ez da beti irizpide nahikoa. Piztutako kandela batean bi prozesu daude: argizaria urtzea aldaketa fisikoa da, eta erretzea aldaketa kimikoa.</p><p>Materiak masa du eta bolumena hartzen du. Airea, ikusten ez badugu ere, materia da: espazioa hartzen du eta masa du. Airez betetako puxika batek hutsik dagoen puxika berak baino masa handiagoa du. Arkatza, karbono dioxidoa, kea, ibai bateko ura, harea eta kotoia materia dira. Argia, soinua eta alferkeria ez dira materia. Musikak energia transmititzen du, baina ez da substantzia. Fitxategi digital bat informazioa da; hura gordetzen duen gailua, ordea, materiaz egina dago.</p><p>Temarioan gorputz materialak eta sistema materialak bereizten ditugu. Gorputz batek muga zehatzak ditu, liburu batek, izotz kubo batek edo aulki batek bezala. Likidoetarako eta gasetarako sistema materialen adibideak erabiltzen ditugu, hala nola zukua, airea eta atmosfera. Ontzi batek likido edo gas bat mugatu dezake; ontzia eta barruko edukia ez dira gauza bera.</p><p>Jarraitu aurretik, erantzun hiru galdera hauei. Airea materia al da? Bai, masa du eta bolumena hartzen du. Izotza urtzea aldaketa kimikoa al da? Ez, ura izaten jarraitzen du. Zer aldatzen da papera erretzean? Osaera: substantzia berriak sortzen dira. Erantzunaren izena asmatzea bezain garrantzitsua da irizpidea azaltzea.</p><h2>Materiaren propietateak</h2><audio controls src="fiki-u1-02-eus.mp3"></audio><p>Propietateek materia deskribatzeko eta alderatzeko balio dute. Propietate guztiek ez dute informazio bera ematen. Unitate honetan hiru sailkapen erabiltzen ditugu. Propietate berak sailkapen bakoitzeko etiketa bat du. Ez dugu kuantitatiboa, intentsiboa edo bereizgarria aukeren artean bakarra hautatu behar: galdera desberdinei erantzuten diete.</p><p>Lehenengo galdera: zenbaki eta unitate batez adierazten da, edo nolakotasun bat deskribatzen du? Propietate kuantitatiboak neurtu daitezke: masa, bolumena, tenperatura edo dentsitatea. Propietate kualitatiboek kolorea edo leuntasuna bezalako ezaugarriak deskribatzen dituzte. Oihal bat zuria dela esatea nolakotasun bat deskribatzea da. Haren luzera ehun eta berrogeita hamar zentimetrokoa dela esatea neurri bat ematea da.</p><p>Bigarren galdera: materia kantitatearen araberakoa da? Propietate estentsiboak kantitatearen araberakoak dira. Lagin homogeneo bat bikoiztean, masa eta bolumena bikoizten dira. Propietate intentsiboak ez dira kantitatearen araberakoak. Tenperatura berean dagoen ura zatitzen badugu, zati bakoitzak tenperatura eta dentsitate bera mantentzen ditu. Laginak baldintza beretan alderatzen ditugu.</p><p>Hirugarren galdera: substantzia identifikatzen laguntzen du? Propietate orokorrak, masa eta bolumena adibidez, ez dira nahikoak substantzia identifikatzeko. Material desberdinek masa bera izan dezakete. Propietate bereizgarriek, dentsitateak, disolbagarritasunak, gogortasunak eta irakite tenperaturak, substantziak bereizten laguntzen dute. Batzuk baldintzen araberakoak dira: irakite tenperatura, adibidez, presioarekin aldatzen da.</p><p>Temarioaren sailkapenaren arabera, tenperatura kuantitatiboa, intentsiboa eta orokorra da. Kolorea eta leuntasuna kualitatiboak, intentsiboak eta orokorrak dira. Irakite tenperatura kuantitatiboa, intentsiboa eta bereizgarria da. Gogortasuna kuantitatibotzat hartzen dugu, eskalen bidez alderatu daitekeelako; intentsiboa eta bereizgarria ere bada. Dentsitatea eta disolbagarritasuna kuantitatiboak, intentsiboak eta bereizgarriak dira. Bolumena kuantitatiboa, estentsiboa eta orokorra da.</p><p>Ez nahastu tenperatura eta irakite tenperatura. Lehenengoak laginak une horretan duen egoera termikoa adierazten du. Bigarrenak substantzia batek presio jakin batean zer tenperaturatan irakiten duen adierazten du. Ur beraren botila batek eta edalontzi batek bolumen desberdina eta dentsitate bera izan ditzakete.</p><p>Erantzuteko metodoa: lehenik, begiratu neurria edo nolakotasuna den. Gero, pentsatu zer gertatuko litzatekeen lagina zatitzean. Azkenik, erabaki propietateak substantzia identifikatzen laguntzen duen. Horrela etiketa bakoitza arrazoitu ahal izango duzu, hitz zerrenda bat buruz ikasi beharrean.</p><h2>Neurtzea eta unitateak bihurtzea</h2><audio controls src="fiki-u1-03-eus.mp3"></audio><p>Magnitudea neurtu daitekeen propietatea da. Neurtzea erreferentzia unitate batekin alderatzea da. Neurri oso batek zenbaki bat eta unitate bat ditu. Bost esatea ez da nahikoa; bost metro esateak luzera adierazten du. Tresna egokia aukeratzen dugu: erregela luzerarako, balantza masarako, kronometroa denborarako eta termometroa tenperaturarako.</p><p>Nazioarteko Sistemak neurriak unitate komunekin adierazteko balio du. Oinarrizko zazpi unitateak hauek dira: metroa luzerarako, kilogramoa masarako, segundoa denborarako, kelvina tenperaturarako, amperea korronte elektrikoaren intentsitaterako, mola substantzia kantitaterako eta kandela argi intentsitaterako. Kelvinaren ikurra K da, gradu ikurrik gabe. Ikurrek ez dute pluralik. Bolumena, azalera eta dentsitatea magnitude eratorriak dira. Nazioarteko Sisteman metro kubiko, metro karratu eta kilogramo metro kubikoko unitateetan adierazten dira.</p><p>Bihurketetarako kilo, hekto, deka, unitatea, dezi, zenti eta mili erabiliko ditugu. Luzera, masa edo edukieraren eskalan, unitate txikiago batera urrats bat egitean hamarrez biderkatzen dugu. Handiago batera joatean, hamarrez zatitzen dugu. Kilogramotik gramora hiru urrats daude: milaz biderkatzen dugu. Kilogramotik miligramora sei urrats daude: milioi batez biderkatzen dugu. Beraz, zero koma zero zortzi kilogramo laurogei mila miligramo dira.</p><p>Azaleretan, urrats bakoitzean ehunez biderkatzen edo zatitzen dugu. Metro karratu batean hamar mila zentimetro karratu daude. Metro batek ehun zentimetro ditu eta ehun bider ehun hamar mila da. Zortzi mila laurehun eta berrogeita hamasei zentimetro karratu zero koma zortzi lau bost sei metro karratu dira. Ez erabili luzerarako faktorea azalerak bihurtzeko.</p><p>Bolumen kubikoetan, urrats bakoitzean milaz biderkatzen edo zatitzen dugu. Metro kubiko bat mila dezimetro kubiko eta milioi bat zentimetro kubiko dira. Eskalak hiru dimentsio ditu. Ez nahastu metroa, metro karratua eta metro kubikoa: magnitude desberdinak neurtzen dituzte.</p><p>Litroa egunero erabiltzen dugun edukiera unitatea da. Litro bat dezimetro kubiko baten berdina da, zehazki. Mililitro bat zentimetro kubiko bat da. Metro kubiko bat mila litro da. Horrela, zortziehun eta hirurogeita hamabost mililitro zero koma zortzi zazpi bost dezimetro kubiko dira. Dekametro kubikoetatik litroetara pasatzeko, lehenik metro kubikoetara pasa gaitezke eta gero litroetara. Zazpi koma bost dekametro kubiko zazpi mila eta bostehun metro kubiko dira, hau da, zazpi milioi eta bostehun mila litro.</p><p>Neurriak ordenatzeko, bihurtu denak unitate berera alderatu aurretik. Zortzi koma bi dekametro laurogeita bi metro dira. Berrehun eta berrogeita hamalau zentimetro bi koma bost lau metro dira. Zero koma zero zero zero hiru kilometro zero koma hiru metro dira. Lehenengoa da handiena, gero bigarrena eta azkenik hirugarrena.</p><p>Ariketa bakoitzean idatzi baliokidetasuna, kalkulatu eta jarri azken unitatea. Egiaztatu zenbakia handitu edo txikitu behar den. Unitate txikiagoa erabiltzean, unitate gehiago behar ditugu kantitate bera adierazteko. Unitatea aldatzeak ez du benetako kantitatea aldatzen.</p><h2>Dentsitatea eta flotazioa</h2><audio controls src="fiki-u1-04-eus.mp3"></audio><p>Zerk du masa handiagoa: kilogramo bat burdinak edo mila gramo lumak? Masa bera dute. Aldatzen dena hartzen duten bolumena da. Lumek askoz espazio gehiago hartzen dute. Bolumen berean zenbat materia dagoen alderatzeko dentsitatea erabiltzen dugu.</p><p>Dentsitatea masa zati bolumena da. Bi kutxek bolumen bera badute eta batek bost kilogramo eta besteak hogei kilogramo baditu, bigarrenaren batez besteko dentsitatea lau aldiz handiagoa da. Masak bakarrik ezagutzen baditugu, bolumenak jakin gabe, ezin dugu dentsitate handiena zeinek duen erabaki.</p><p>Dentsitatea kuantitatiboa, intentsiboa eta bereizgarria da. Substantzia homogeneo batean, baldintza beretan, ez da aldatzen lagin handiago bat hartzeagatik. Masa eta bolumena batera bikoiztean, zatidura bera mantentzen da. Nazioarteko Sistemako unitatea kilogramo metro kubikoko da. Gramo zentimetro kubikoko unitatea ere erabiliko dugu. Gramo bat zentimetro kubikoko mila kilogramo metro kubikoko dira.</p><p>Kalkulatu dezagun. Lagin batek berrogei gramoko masa eta hogei zentimetro kubikoko bolumena ditu. Berrogei zati hogei eginez, dentsitatea bi gramo zentimetro kubikoko da. Dentsitatea eta bolumena ezagutzen baditugu, biderkatzen dugu: masa berdin dentsitatea bider bolumena. Bi gramo zentimetro kubikoko dentsitatea duen substantziak hogeita hamar zentimetro kubiko hartzen baditu, hirurogei gramoko masa du. Masa eta dentsitatea ezagutzen baditugu, zatitzen dugu: bolumena berdin masa zati dentsitatea. Hirurogei gramo zati bi gramo zentimetro kubikoko eginez, hogeita hamar zentimetro kubiko lortzen ditugu.</p><p>Eragiketak egin aurretik, begiratu unitateak. Ez zatitu zuzenean kilogramoko masa zentimetro kubikoko bolumenarekin, emaitza gramo zentimetro kubikoko eskatzen badizute. Bihurtu masa gramotara, edo bi magnitudeak Nazioarteko Sistemako unitateetara. Kilogramo bat mila gramo dira. Bostehun zentimetro kubikoko bolumenarekin, mila zati bostehun eginez, bi gramo zentimetro kubikoko lortzen dugu.</p><p>Flotazioa ulertzeko, objektuaren batez besteko dentsitatea fluidoaren dentsitatearekin alderatzen dugu. Eredu sinple batean, ura baino dentsitate txikiagoa duen objektua flotatu egiten da; handiagoa duena hondoratu egiten da. Dentsitate bera badute, esekita gera daiteke. Izotzak ur likidoak baino dentsitate txikiagoa du, eta horregatik flotatzen du. Ohiko olioak urak baino dentsitate txikiagoa du. Gainera, ez da urarekin nahasten; horregatik geratzen da gainean.</p><p>Ez da nahikoa objektu astun bat hondoratzen dela esatea. Itsasontzi batek masa handia izan eta flotatu egin dezake, kanpoko bolumenak airez betetako espazioak hartzen dituelako eta batez besteko dentsitatea txikia delako. Garrantzitsuena masa eta bolumenaren arteko erlazioa da. Amaieran egiaztatu formula, unitateak eta emaitza zentzuzkoa den.</p></noscript>
