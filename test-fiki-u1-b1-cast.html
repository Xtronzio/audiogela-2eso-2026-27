</section></main><script>const FIKI_LEVELS=[{"nivel":1,"nombre":"Conceptos básicos","descripcion":"Reconocer los conceptos esenciales del bloque.","preguntas":[["¿Qué define la materia?",["Masa y volumen","Color y brillo","Sonido y luz","Forma fija y dureza"],0,"La materia tiene masa y ocupa espacio; ser visible o tener forma fija no es requisito."],["¿Qué respalda la ciencia?",["Opiniones sin pruebas","Tradiciones sin examen","Afirmaciones de autoridad","Evidencias contrastables"],3,"La observación y el experimento permiten contrastar explicaciones."],["¿Qué estudia la Física?",["Solo la organización social","Solo nombres de sustancias","Fenómenos como calor y movimiento","Solo la vida de las plantas"],2,"La Física estudia fenómenos de la materia y la energía, incluidos movimiento, calor y cambios de estado."],["¿Qué estudia la Química?",["Solo conducta de sociedades","Composición y transformaciones","Solo distancias recorridas","Solo tamaños de recipientes"],1,"La Química estudia la composición y los cambios que producen sustancias diferentes."],["¿Qué caracteriza un cambio físico?",["Se conserva la sustancia","Siempre se forma otra sustancia","Siempre desaparece la masa","Nunca cambia el estado"],0,"Cambiar forma, tamaño o estado sin producir otra sustancia es un cambio físico."],["¿Qué caracteriza un cambio químico?",["Solo cambio de recipiente","Solo cambio de posición","Solo cambio de tamaño","Formación de sustancias nuevas"],3,"La aparición de sustancias nuevas indica cambio de composición."],["¿Derretir hielo es un cambio…?",["Químico: desaparece agua","Físico: pierde toda su masa","Físico: sigue siendo agua","Químico: aparece oxígeno"],2,"El cambio de estado no cambia la identidad del agua."],["¿Oxidar hierro es un cambio…?",["Químico: deja de tener volumen","Químico: se forma óxido","Físico: solo cambia tamaño","Físico: solo cambia posición"],1,"El óxido es una sustancia diferente; doblar o cortar mantiene la sustancia inicial."],["¿Cortar papel es un cambio…?",["Físico: mantiene su composición","Químico: crea otra sustancia","Químico: genera siempre cenizas","Físico: su masa se vuelve cero"],0,"La reversibilidad no es criterio absoluto: al cortar se conserva el material."],["En una vela, fundir cera y quemarla son…",["Fusión química; combustión física","Ambos físicos: solo hay calor","Ambos químicos: cambia el estado","Fusión física; combustión química"],3,"La cera fundida sigue siendo cera; al arder produce otras sustancias."],["¿La luz es materia?",["Líquido sin masa medible","Sólido que no ocupa espacio","Fenómeno energético, no sustancia","Gas material de forma fija"],2,"La lámpara es material; la luz es radiación que transmite energía."],["¿La música es materia?",["Masa nueva en cada vibración","Energía; el soporte sí es materia","Materia creada por cada nota","Agua que sale del altavoz"],1,"El aire y el altavoz son materiales; el sonido es una onda que transporta energía."],["¿Qué es un archivo MP3 como información?",["Información con soporte material","Gas formado por sonidos","Líquido guardado en memoria","Sólido de forma musical"],0,"El contenido digital es información; el dispositivo y los estados físicos que la representan son materiales."],["¿Qué ejemplo es un cuerpo material?",["Zumo","Aire","Atmósfera","Un libro"],3,"En la clasificación escolar, el libro tiene límites definidos y es un cuerpo material."],["¿Qué ejemplo es un sistema material en el temario?",["Teléfono","Avión","Zumo","Libro"],2,"El temario usa líquidos y gases como sistemas materiales; el recipiente es otra cosa."],["Una botella y el agua que contiene son…",["Ambos son información digital","Botella: cuerpo; agua: sistema","Botella: sistema; agua: cuerpo","Ambos son fenómenos sin materia"],1,"Se sigue la clasificación escolar y se distingue continente de contenido."],["¿Qué ciencias estudian seres vivos?",["Ciencias biológicas","Ciencias sociales","Solo Física","Solo economía"],0,"Las ciencias biológicas estudian la vida y los seres viv const safeStorage={getItem:key=>{try{return localStorage.getItem(key);}catch{return null;}},setItem:(key,value)=>{try{localStorage.setItem(key,value);}catch{}},removeItem:key=>{try{localStorage.removeItem(key);}catch{}}};

const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;
function key(n){return `audiogela:fiki:u1:b1:cast:r2:nivel:${n}`};function renderLevels(){levels.innerHTML='';FIKI_LEVELS.forEach(n=>{const best=Number(safeStorage.getItem(key(n.nivel))||0),b=document.createElement('button');b.className='level';b.innerHTML=`<span class="level-number">${n.nivel}</span><span><strong>${n.nombre}</strong><small>${n.descripcion}</small></span><span class="level-score">${best?`Mejor: ${best}/10`:'Sin realizar'}</span>`;b.onclick=()=>start(n);levels.appendChild(b)})}
function lengthType(q){const lengths=q[1].map(x=>x.length),value=lengths[q[2]],max=Math.max(...lengths),min=Math.min(...lengths);if(max===min)return'M';if(value===max)return'L';if(value===min)return'S';return'M'}
function selectQuestions(n){const queueKey=`audiogela:fiki:u1:b1:cast:r2:cola:v6:${n.nivel}`;let queued=[];try{queued=JSON.parse(safeStorage.getItem(queueKey)||'[]')}catch(e){queued=[]}const valid=Array.isArray(queued)&&queued.length===10&&new Set(queued).size===10&&queued.every(i=>Number.isInteger(i)&&i>=0&&i<n.preguntas.length);if(valid){safeStorage.removeItem(queueKey);return shuffle(queued.map(i=>n.preguntas[i]))}const groups={L:[],S:[],M:[]};n.preguntas.forEach((q,i)=>groups[lengthType(q)].push(i));Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));const chosen=[];Object.values(groups).forEach(g=>chosen.push(...g.splice(0,Math.floor(g.length/2))));const unused=shuffle(Object.values(groups).flat());while(chosen.length<10)chosen.push(unused.pop());const remaining=n.preguntas.map((_,i)=>i).filter(i=>!chosen.includes(i));safeStorage.setItem(queueKey,JSON.stringify(remaining));return shuffle(chosen.map(i=>n.preguntas[i]))}
function start(n){selected=n;questions=selectQuestions(n);index=0;correct=0;menu.style.display='none';result.className='result';quiz.className='quiz show';document.getElementById('level-label').textContent=`NIVEL ${n.nivel} DE 5`;document.getElementById('level-title').textContent=n.nombre;renderQuestion()}
function renderQuestion(){answered=false;const item=questions[index],opts=shuffle(item[1].map((text,i)=>({text,ok:i===item[2]})));document.getElementById('counter').textContent=`Pregunta ${index+1} de ${questions.length}`;document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${index/questions.length*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>choose(o,b,item,box);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').className='next'}
function choose(o,b,item,box){if(answered)return;answered=true;[...box.children].forEach(x=>x.disabled=true);const right=[...box.children].find(x=>x.textContent===item[1][item[2]]);right.classList.add('correct');const f=document.getElementById('feedback');if(o.ok){correct++;f.className='feedback show ok';f.textContent='Correcto. '+item[3]}else{b.classList.add('wrong');f.className='feedback show bad';f.textContent='La respuesta correcta es: '+item[1][item[2]]+'. '+item[3]}document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${(index+1)/questions.length*100}%`;const next=document.getElementById('next');next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}
function finish(){quiz.className='quiz';result.className='result show';document.getElementById('result-level').textContent=`NIVEL ${selected.nivel} · ${selected.nombre.toUpperCase()}`;document.getElementById('score').textContent=`${correct}/10`;const passed=correct>=8;document.getElementById('result-title').textContent=passed?'Nivel superado':'Conviene repetir este nivel';document.getElementById('result-text').textContent=passed?'Has alcanzado el 80 %. Puedes continuar con el siguiente nivel.':'Vuelve a escuchar el episodio, revisa las explicaciones y repite el nivel.';const best=Math.max(Number(safeStorage.getItem(key(selected.nivel))||0),correct);safeStorage.setItem(key(selected.nivel),best);document.getElementById('best').textContent=`Mejor resultado de este nivel: ${best}/10`}
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()};document.getElementById('retry').onclick=()=>start(selected);document.getElementById('levels-button').onclick=()=>{result.className='result';menu.style.display='block';renderLevels()};renderLevels();
</script></body></html>
