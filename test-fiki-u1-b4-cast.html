</section></main><script>const FIKI_LEVELS=[{"nivel":1,"nombre":"Conceptos básicos","descripcion":"Reconocer los conceptos esenciales del bloque.","preguntas":[["¿Qué expresa la densidad?",["Masa por unidad de volumen","Volumen por unidad de tiempo","Masa por unidad de longitud","Temperatura por unidad de masa"],0,"La densidad relaciona cuánta masa ocupa un volumen: d = m/V."],["¿Cuál es la fórmula de densidad?",["d = m × V","d = V / m","d = m + V","d = m / V"],3,"Dividimos masa entre volumen, con unidades compatibles."],["¿Cuál es la fórmula para masa a partir de densidad?",["m = V / d","m = d + V","m = d × V","m = d / V"],2,"Multiplicar d por V despeja la masa y da unidades de masa."],["¿Cuál es la fórmula para volumen a partir de densidad?",["V = m + d","V = m / d","V = m × d","V = d / m"],1,"Dividir m entre d da volumen."],["¿Cuál es la unidad SI de densidad?",["kg/m³","kg × m³","m³/kg","kg/m"],0,"La unidad SI divide kilogramo entre metro cúbico."],["¿Qué equivalencia une g/cm³ y SI?",["1 g/cm³ = 1 kg/m³","1 g/cm³ = 0,001 kg/m³","1 g/cm³ = 100 kg/m³","1 g/cm³ = 1000 kg/m³"],3,"1 g = 0,001 kg y 1 cm³ = 0,000001 m³: el cociente es 1000."],["¿Cómo se clasifica densidad respecto a cantidad?",["Solo cualitativa","Sin relación con propiedades","Intensiva","Extensiva"],2,"En una sustancia homogénea y mismas condiciones, d no cambia por la cantidad tomada."],["Si masa y volumen se duplican juntos, densidad…",["Se vuelve cero","Se mantiene","Se duplica","Se reduce a la mitad"],1,"2m/(2V) = m/V, si la sustancia y las condiciones se mantienen."],["Con igual volumen, más masa implica…",["Mayor densidad","Menor densidad","Igual densidad siempre","Densidad nula"],0,"Con V fijo, d aumenta al aumentar m."],["Con igual masa, más volumen implica…",["Mayor densidad","Igual densidad siempre","Densidad infinita","Menor densidad"],3,"Con m fija, aumentar V reduce el cociente."],["¿Basta saber masas para comparar densidades?",["Solo nombres de recipientes","Solo la longitud de la mesa","Volúmenes además de masas","Solo colores de muestras"],2,"La densidad depende de dos magnitudes: masa y volumen."],["Antes de calcular d, ¿qué revisar?",["Comparar solo cifras iniciales","Hacer compatibles las unidades","Borrar todas las unidades","Multiplicar siempre por cien"],1,"Para g/cm³ se usa masa en g y volumen en cm³, o se transforma el resultado correctamente."],["En el modelo sencillo, un objeto menos denso que agua…",["Flota","Se hunde","Pierde toda su masa","No desplaza fluido"],0,"El criterio simplificado compara densidad media del objeto y densidad del fluido."],["En el modelo sencillo, un objeto más denso que agua…",["Flota","Pierde su volumen","Se convierte en agua","Se hunde"],3,"Si la densidad media es mayor, el objeto se hunde en el modelo sencillo."],["Si objeto y fluido tienen igual densidad, puede…",["Hundirse obligatoriamente","Desaparecer del fluido","Quedar suspendido","Subir siempre a superficie"],2,"La igualdad permite equilibrio de peso y empuje para un objeto sumergido."],["¿Por qué flota el hielo en agua?",["Hielo que no desplaza agua","Hielo menos denso que agua líquida","Hielo sin masa ni volumen","Hielo más denso que agua líquida"],1,"El hielo tiene masa y volumen; su densidad es menor que la del agua líquida."],["¿Por qué el aceite habitual queda sobre agua?",["Menor densidad y no se mezcla","Mayor densidad y se mezcla","Masa nula y color amarillo","Igual densidad y mismo color"],0,"El aceite habitual es menos denso y no es miscible con agua."],["¿Por qué puede flotar un barco de metal?",["Masa desaparece al tocar agua","Metal sin volumen exterior","Agua se convierte en metal","Baja densidad media con aire"],3,"Se compara la densidad media del barco completo, incluidos espacios con aire, con la del agua."],["¿En qué dirección actúa el empuje de un fluido?",["Siempre horizontal","Sin dirección definida","Vertical hacia arriba","Vertical hacia abajo"],2,"El empuje es vertical y hacia arriba; el peso actúa hacia abajo."],["¿Qué afirma el principio de Arquímedes?",["Color del fluido","Peso del fluido desplazado","Masa del recipiente vacío","Longitud del objeto"],1,"El empuje equivale al peso del fluido desplazado, no siempre al peso del objeto."]]},{"nivel":2,"nombre":"Comprensión","descripcion":"Comprender ejemplos y explicar criterios.","preguntas":[["¿Cómo comparar masa para igual espacio ocupado?",["Masa por unidad de volumen","Volumen por unidad de tiempo","Masa por unidad de longitud","Temperatura por unidad de masa"],0,"La densidad relaciona cuánta masa ocupa un volumen: d = m/V."],["Con masa y volumen conocidos, ¿qué relación usar?",["d = m × V","d = V / m","d = m + V","d = m / V"],3,"Dividimos masa entre volumen, con unidades compatibles."],["Con densidad y volumen conocidos, ¿qué relación usar?",["m = V / d","m = d + V","m = d × V","m = d / V"],2,"Multiplicar d por V despeja la masa y da unidades de masa."],["Con masa y densidad conocidas, ¿qué relación usar?",["V = m + d","V = m / d","V = m × d","V = d / m"],1,"Dividir m entre d da volumen."],["Masa en kg y volumen en m³ producen densidad en…",["kg/m³","kg × m³","m³/kg","kg/m"],0,"La unidad SI divide kilogramo entre metro cúbico."],["¿Qué densidad SI corresponde a 1 g/cm³?",["1 g/cm³ = 1 kg/m³","1 g/cm³ = 0,001 kg/m³","1 g/cm³ = 100 kg/m³","1 g/cm³ = 1000 kg/m³"],3,"1 g = 0,001 kg y 1 cm³ = 0,000001 m³: el cociente es 1000."],["Una muestra grande y otra pequeña conservan densidad. ¿Qué indica?",["Solo cualitativa","Sin relación con propiedades","Intensiva","Extensiva"],2,"En una sustancia homogénea y mismas condiciones, d no cambia por la cantidad tomada."],["Juntamos dos porciones iguales de agua. ¿Qué pasa con densidad?",["Se vuelve cero","Se mantiene","Se duplica","Se reduce a la mitad"],1,"2m/(2V) = m/V, si la sustancia y las condiciones se mantienen."],["Dos cajas iguales: la más masiva tiene densidad…",["Mayor densidad","Menor densidad","Igual densidad siempre","Densidad nula"],0,"Con V fijo, d aumenta al aumentar m."],["Hierro y plumas con igual masa: las plumas ocupan más. Su densidad es…",["Mayor densidad","Igual densidad siempre","Densidad infinita","Menor densidad"],3,"Con m fija, aumentar V reduce el cociente."],["Dos objetos tienen distinta masa pero no conocemos volumen. ¿Qué falta?",["Solo nombres de recipientes","Solo la longitud de la mesa","Volúmenes además de masas","Solo colores de muestras"],2,"La densidad depende de dos magnitudes: masa y volumen."],["Tenemos kg y cm³ pero piden g/cm³. ¿Qué hacer primero?",["Comparar solo cifras iniciales","Hacer compatibles las unidades","Borrar todas las unidades","Multiplicar siempre por cien"],1,"Para g/cm³ se usa masa en g y volumen en cm³, o se transforma el resultado correctamente."],["Un objeto tiene densidad media menor que el fluido. ¿Qué predice el modelo?",["Flota","Se hunde","Pierde toda su masa","No desplaza fluido"],0,"El criterio simplificado compara densidad media del objeto y densidad del fluido."],["Un objeto tiene densidad media mayor que el fluido. ¿Qué predice el modelo?",["Flota","Pierde su volumen","Se convierte en agua","Se hunde"],3,"Si la densidad media es mayor, el objeto se hunde en el modelo sencillo."],["Con densidades iguales, ¿qué predice el modelo sencillo?",["Hundirse obligatoriamente","Desaparecer del fluido","Quedar suspendido","Subir siempre a superficie"],2,"La igualdad permite equilibrio de peso y empuje para un objeto sumergido."],["Hielo y agua líquida: ¿qué diferencia explica flotación?",["Hielo que no desplaza agua","Hielo menos denso que agua líquida","Hielo sin masa ni volumen","Hielo más denso que agua líquida"],1,"El hielo tiene masa y volumen; su densidad es menor que la del agua líquida."],["Aceite y agua forman capas. ¿Qué dos ideas lo explican?",["Menor densidad y no se mezcla","Mayor densidad y se mezcla","Masa nula y color amarillo","Igual densidad y mismo color"],0,"El aceite habitual es menos denso y no es miscible con agua."],["Un barco pesado flota. ¿Qué densidad se compara?",["Masa desaparece al tocar agua","Metal sin volumen exterior","Agua se convierte en metal","Baja densidad media con aire"],3,"Se compara la densidad media del barco completo, incluidos espacios con aire, con la del agua."],["Un cuerpo sumergido recibe empuje. ¿Hacia dónde?",["Siempre horizontal","Sin dirección definida","Vertical hacia arriba","Vertical hacia abajo"],2,"El empuje es vertical y hacia arriba; el peso actúa hacia abajo."],["¿Con qué se relaciona el empuje sobre un cuerpo sumergido?",["Color del fluido","Peso del fluido desplazado","Masa del recipiente vacío","Longitud del objeto"],1,"El empuje equivale al peso del fluido desplazado, no siempre al peso del objeto."]]},{"nivel":3,"nombre":"Relaciones y clasificación","descripcion":"Relacionar magnitudes, procesos y clasificaciones.","preguntas":[["Relaciona masa y volumen mediante densidad.",["Masa por unidad de volumen","Volumen por unidad de tiempo","Masa por unidad de longitud","Temperatura por unidad de masa"],0,"La densidad relaciona cuánta masa ocupa un volumen: d = m/V."],["¿Cómo se relacionan d, m y V?",["d = m × V","d = V / m","d = m + V","d = m / V"],3,"Dividimos masa entre volumen, con unidades compatibles."],["Despeja m en d = m/V.",["m = V / d","m = d + V","m = d × V","m = d / V"],2,"Multiplicar d por V despeja la masa y da unidades de masa."],["Despeja V en d = m/V.",["V = m + d","V = m / d","V = m × d","V = d / m"],1,"Dividir m entre d da volumen."],["Relaciona fórmula y unidad SI.",["kg/m³","kg × m³","m³/kg","kg/m"],0,"La unidad SI divide kilogramo entre metro cúbico."],["Relaciona las dos unidades de densidad.",["1 g/cm³ = 1 kg/m³","1 g/cm³ = 0,001 kg/m³","1 g/cm³ = 100 kg/m³","1 g/cm³ = 1000 kg/m³"],3,"1 g = 0,001 kg y 1 cm³ = 0,000001 m³: el cociente es 1000."],["¿Qué relación hay entre densidad y tamaño de muestra homogénea?",["Solo cualitativa","Sin relación con propiedades","Intensiva","Extensiva"],2,"En una sustancia homogénea y mismas condiciones, d no cambia por la cantidad tomada."],["¿Qué ocurre con m/V al duplicar numerador y denominador?",["Se vuelve cero","Se mantiene","Se duplica","Se reduce a la mitad"],1,"2m/(2V) = m/V, si la sustancia y las condiciones se mantienen."],["¿Cómo varía m/V al aumentar solo m?",["Mayor densidad","Menor densidad","Igual densidad siempre","Densidad nula"],0,"Con V fijo, d aumenta al aumentar m."],["¿Cómo varía m/V al aumentar solo V?",["Mayor densidad","Igual densidad siempre","Densidad infinita","Menor densidad"],3,"Con m fija, aumentar V reduce el cociente."],["Relaciona datos necesarios para d.",["Solo nombres de recipientes","Solo la longitud de la mesa","Volúmenes además de masas","Solo colores de muestras"],2,"La densidad depende de dos magnitudes: masa y volumen."],["Relaciona datos y unidad solicitada.",["Comparar solo cifras iniciales","Hacer compatibles las unidades","Borrar todas las unidades","Multiplicar siempre por cien"],1,"Para g/cm³ se usa masa en g y volumen en cm³, o se transforma el resultado correctamente."],["Relaciona menor densidad media y flotación.",["Flota","Se hunde","Pierde toda su masa","No desplaza fluido"],0,"El criterio simplificado compara densidad media del objeto y densidad del fluido."],["Relaciona mayor densidad media y flotación.",["Flota","Pierde su volumen","Se convierte en agua","Se hunde"],3,"Si la densidad media es mayor, el objeto se hunde en el modelo sencillo."],["Relaciona densidades iguales y equilibrio.",["Hundirse obligatoriamente","Desaparecer del fluido","Quedar suspendido","Subir siempre a superficie"],2,"La igualdad permite equilibrio de peso y empuje para un objeto sumergido."],["Relaciona hielo y densidad del agua líquida.",["Hielo que no desplaza agua","Hielo menos denso que agua líquida","Hielo sin masa ni volumen","Hielo más denso que agua líquida"],1,"El hielo tiene masa y volumen; su densidad es menor que la del agua líquida."],["Relaciona densidad e inmiscibilidad de aceite y agua.",["Menor densidad y no se mezcla","Mayor densidad y se mezcla","Mas const safeStorage={getItem:key=>{try{return localStorage.getItem(key);}catch{return null;}},setItem:(key,value)=>{try{localStorage.setItem(key,value);}catch{}},removeItem:key=>{try{localStorage.removeItem(key);}catch{}}};

const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;
function key(n){return `audiogela:fiki:u1:b4:cast:r2:nivel:${n}`};function renderLevels(){levels.innerHTML='';FIKI_LEVELS.forEach(n=>{const best=Number(safeStorage.getItem(key(n.nivel))||0),b=document.createElement('button');b.className='level';b.innerHTML=`<span class="level-number">${n.nivel}</span><span><strong>${n.nombre}</strong><small>${n.descripcion}</small></span><span class="level-score">${best?`Mejor: ${best}/10`:'Sin realizar'}</span>`;b.onclick=()=>start(n);levels.appendChild(b)})}
function lengthType(q){const lengths=q[1].map(x=>x.length),value=lengths[q[2]],max=Math.max(...lengths),min=Math.min(...lengths);if(max===min)return'M';if(value===max)return'L';if(value===min)return'S';return'M'}
function selectQuestions(n){const queueKey=`audiogela:fiki:u1:b4:cast:r2:cola:v6:${n.nivel}`;let queued=[];try{queued=JSON.parse(safeStorage.getItem(queueKey)||'[]')}catch(e){queued=[]}const valid=Array.isArray(queued)&&queued.length===10&&new Set(queued).size===10&&queued.every(i=>Number.isInteger(i)&&i>=0&&i<n.preguntas.length);if(valid){safeStorage.removeItem(queueKey);return shuffle(queued.map(i=>n.preguntas[i]))}const groups={L:[],S:[],M:[]};n.preguntas.forEach((q,i)=>groups[lengthType(q)].push(i));Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));const chosen=[];Object.values(groups).forEach(g=>chosen.push(...g.splice(0,Math.floor(g.length/2))));const unused=shuffle(Object.values(groups).flat());while(chosen.length<10)chosen.push(unused.pop());const remaining=n.preguntas.map((_,i)=>i).filter(i=>!chosen.includes(i));safeStorage.setItem(queueKey,JSON.stringify(remaining));return shuffle(chosen.map(i=>n.preguntas[i]))}
function start(n){selected=n;questions=selectQuestions(n);index=0;correct=0;menu.style.display='none';result.className='result';quiz.className='quiz show';document.getElementById('level-label').textContent=`NIVEL ${n.nivel} DE 5`;document.getElementById('level-title').textContent=n.nombre;renderQuestion()}
function renderQuestion(){answered=false;const item=questions[index],opts=shuffle(item[1].map((text,i)=>({text,ok:i===item[2]})));document.getElementById('counter').textContent=`Pregunta ${index+1} de ${questions.length}`;document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${index/questions.length*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>choose(o,b,item,box);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').className='next'}
function choose(o,b,item,box){if(answered)return;answered=true;[...box.children].forEach(x=>x.disabled=true);const right=[...box.children].find(x=>x.textContent===item[1][item[2]]);right.classList.add('correct');const f=document.getElementById('feedback');if(o.ok){correct++;f.className='feedback show ok';f.textContent='Correcto. '+item[3]}else{b.classList.add('wrong');f.className='feedback show bad';f.textContent='La respuesta correcta es: '+item[1][item[2]]+'. '+item[3]}document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${(index+1)/questions.length*100}%`;const next=document.getElementById('next');next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}
function finish(){quiz.className='quiz';result.className='result show';document.getElementById('result-level').textContent=`NIVEL ${selected.nivel} · ${selected.nombre.toUpperCase()}`;document.getElementById('score').textContent=`${correct}/10`;const passed=correct>=8;document.getElementById('result-title').textContent=passed?'Nivel superado':'Conviene repetir este nivel';document.getElementById('result-text').textContent=passed?'Has alcanzado el 80 %. Puedes continuar con el siguiente nivel.':'Vuelve a escuchar el episodio, revisa las explicaciones y repite el nivel.';const best=Math.max(Number(safeStorage.getItem(key(selected.nivel))||0),correct);safeStorage.setItem(key(selected.nivel),best);document.getElementById('best').textContent=`Mejor resultado de este nivel: ${best}/10`}
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()};document.getElementById('retry').onclick=()=>start(selected);document.getElementById('levels-button').onclick=()=>{result.className='result';menu.style.display='block';renderLevels()};renderLevels();
</script></body></html>
