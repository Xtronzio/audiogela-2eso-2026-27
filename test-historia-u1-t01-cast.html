<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B438F"><title>Autoevaluación interactiva T01 · AUDIO GELA</title><style>
:root{--blue:#0b438f;--pale:#eaf1fb;--text:#17324b;--muted:#607486;--line:#d6e0ec;--ok:#177548;--bad:#b83a3a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#edf3f9);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(820px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.back{color:var(--blue);text-decoration:none;font-weight:800}.brand,.eyebrow{font-size:.75rem;color:var(--blue);font-weight:900;letter-spacing:.13em}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:0 18px 50px rgba(11,67,143,.1)}h1{font-size:clamp(1.65rem,5vw,2.45rem);line-height:1.1;margin:8px 0}.intro{color:var(--muted);line-height:1.55;margin:0 0 22px}.levels{display:grid;gap:11px}.level{display:grid;grid-template-columns:48px 1fr auto;gap:13px;align-items:center;width:100%;padding:14px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--text);cursor:pointer}.level:hover{border-color:var(--blue);background:var(--pale)}.level-number{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;background:var(--blue);color:#fff;font-weight:950;font-size:1.2rem}.level strong{display:block;color:var(--blue);font-size:1rem}.level small{display:block;color:var(--muted);line-height:1.35;margin-top:3px}.level-score{font-size:.8rem;color:var(--muted);font-weight:800;white-space:nowrap}.progress-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:750}.progress{height:9px;background:#e7edf3;border-radius:999px;margin:8px 0 25px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);transition:.25s}.question{font-size:1.22rem;line-height:1.4;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{width:100%;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-weight:700;line-height:1.35;cursor:pointer}.answer:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.answer.correct{border-color:var(--ok);background:#eaf7f1;color:#105c39}.answer.wrong{border-color:var(--bad);background:#fff0f0;color:#8b2525}.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#eaf7f1;color:#105c39}.feedback.bad{background:#fff0f0;color:#7f2828}.next{display:none;width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.next.show{display:block}.quiz,.result{display:none}.quiz.show,.result.show{display:block}.score{font-size:clamp(3rem,12vw,5.4rem);font-weight:950;color:var(--blue);margin:10px 0;text-align:center}.result{text-align:center}.result p{color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.actions button{border-radius:13px;padding:12px;font-weight:850;cursor:pointer}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid var(--blue);background:#fff;color:var(--blue)}.best{margin-top:15px;font-size:.85rem;color:var(--muted)}@media(max-width:560px){.level{grid-template-columns:42px 1fr}.level-number{width:42px;height:42px}.level-score{grid-column:2}.actions{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html#historia-castellano-u1-t01">← AUDIO GELA</a><span class="brand">HISTORIA · CAST</span></div><section class="card">
<div id="menu"><div class="eyebrow">UNIDAD 1 · TEMA 1</div><h1>Autoevaluación interactiva</h1><p class="intro"><strong>Cómo comenzó la Edad Media.</strong> Realiza los niveles en orden. Se recomienda alcanzar al menos un 80 % antes de pasar al siguiente.</p><div class="levels" id="levels"></div></div>
<div class="quiz" id="quiz"><div class="eyebrow" id="level-label"></div><h1 id="level-title"></h1><div class="progress-row"><span id="counter"></span><span id="points"></span></div><div class="progress"><span id="bar"></span></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Siguiente pregunta</button></div>
<div class="result" id="result"><div class="eyebrow" id="result-level"></div><div class="score" id="score"></div><h2 id="result-title"></h2><p id="result-text"></p><div class="actions"><button class="primary" id="retry">Repetir nivel</button><button class="secondary" id="levels-button">Volver a los niveles</button></div><div class="best" id="best"></div></div>
</section></main><script src="preguntas-historia-u1-t01-cast.js?v=2"></script><script>
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;
function key(n){return `audiogela:t01:cast:nivel:${n}`};function renderLevels(){levels.innerHTML='';NIVELES_T01.forEach(n=>{const best=Number(localStorage.getItem(key(n.nivel))||0),b=document.createElement('button');b.className='level';b.innerHTML=`<span class="level-number">${n.nivel}</span><span><strong>${n.nombre}</strong><small>${n.descripcion}</small></span><span class="level-score">${best?`Mejor: ${best}/10`:'Sin realizar'}</span>`;b.onclick=()=>start(n);levels.appendChild(b)})}
function start(n){selected=n;questions=shuffle(n.preguntas);index=0;correct=0;menu.style.display='none';result.className='result';quiz.className='quiz show';document.getElementById('level-label').textContent=`NIVEL ${n.nivel} DE 5`;document.getElementById('level-title').textContent=n.nombre;renderQuestion()}
function renderQuestion(){answered=false;const item=questions[index],opts=shuffle(item[1].map((text,i)=>({text,ok:i===item[2]})));document.getElementById('counter').textContent=`Pregunta ${index+1} de ${questions.length}`;document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${index/questions.length*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>choose(o,b,item,box);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').className='next'}
function choose(o,b,item,box){if(answered)return;answered=true;[...box.children].forEach(x=>x.disabled=true);const right=[...box.children].find(x=>x.textContent===item[1][item[2]]);right.classList.add('correct');const f=document.getElementById('feedback');if(o.ok){correct++;f.className='feedback show ok';f.textContent='Correcto. '+item[3]}else{b.classList.add('wrong');f.className='feedback show bad';f.textContent='La respuesta correcta es: '+item[1][item[2]]+'. '+item[3]}document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${(index+1)/questions.length*100}%`;const next=document.getElementById('next');next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}
function finish(){quiz.className='quiz';result.className='result show';document.getElementById('result-level').textContent=`NIVEL ${selected.nivel} · ${selected.nombre.toUpperCase()}`;document.getElementById('score').textContent=`${correct}/10`;const passed=correct>=8;document.getElementById('result-title').textContent=passed?'Nivel superado':'Conviene repetir este nivel';document.getElementById('result-text').textContent=passed?'Has alcanzado el 80 %. Puedes continuar con el siguiente nivel.':'Vuelve a escuchar el episodio, revisa las explicaciones y repite el nivel.';const best=Math.max(Number(localStorage.getItem(key(selected.nivel))||0),correct);localStorage.setItem(key(selected.nivel),best);document.getElementById('best').textContent=`Mejor resultado de este nivel: ${best}/10`}
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()};document.getElementById('retry').onclick=()=>start(selected);document.getElementById('levels-button').onclick=()=>{result.className='result';menu.style.display='block';renderLevels()};renderLevels();
</script></body></html>
