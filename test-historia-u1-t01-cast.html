lign:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-weight:700;line-height:1.35;cursor:pointer}.answer:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.answer.correct{border-color:var(--ok);background:#eaf7f1;color:#105c39}.answer.wrong{border-color:var(--bad);background:#fff0f0;color:#8b2525}.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#eaf7f1;color:#105c39}.feedback.bad{background:#fff0f0;color:#7f2828}.next{display:none;width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.next.show{display:block}.quiz,.result{display:none}.quiz.show,.result.show{display:block}.score{font-size:clamp(3rem,12vw,5.4rem);font-weight:950;color:var(--blue);margin:10px 0;text-align:center}.result{text-align:center}.result p{color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.actions button{border-radius:13px;padding:12px;font-weight:850;cursor:pointer}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid var(--blue);background:#fff;color:var(--blue)}.best{margin-top:15px;font-size:.85rem;color:var(--muted)}@media(max-width:560px){.level{grid-template-columns:42px 1fr}.level-number{width:42px;height:42px}.level-score{grid-column:2}.actions{grid-template-columns:1fr}}

<div id="menu"><div class="eyebrow">UNIDAD 1 · TEMA 1</div><h1>Autoevaluación interactiva</h1><p class="intro"><strong>Cómo comenzó la Edad Media.</strong> Realiza los niveles en orden. Se recomienda alcanzar al menos un 80 % antes de pasar al siguiente.</p><div class="levels" id="levels"></div></div>

</section></main><script>
const NIVELES_T01 = [
  {

      ['¿Por qué 476 es una fecha importante?',['Se utiliza para señalar la caída de Occidente y el inicio de la Edad Media','Marca la división del Imperio','Es la fecha de la Hégira','Marca el comienzo del Imperio carolingio'],0,'476 funciona como fecha convencional entre la Edad Antigua y la Edad Media.'],

      ['¿Qué hecho actuó de forma indirecta sobre la caída de Occidente?',['La presión de los hunos sobre los pueblos germánicos','La supervivencia de Oriente','El nombre Mare Nostrum','La duración de la Edad Media'],0,'Los hunos influyeron indirectamente al empujar a otros pueblos hacia Roma.'],
      ['¿Qué hecho actuó de forma más directa sobre la pérdida de control territorial romano?',['La entrada y asentamiento de pueblos germánicos','El nombre del Mediterráneo','La existencia del Imperio de Oriente','El uso de fechas históricas'],0,'Los asentamientos germánicos fragmentaron los territorios occidentales.'],
      ['¿Qué dos procesos ocurrieron entre la división y la caída de Occidente?',['Presiones externas y asentamientos germánicos','Hégira y expansión islámica','Coronación de Carlomagno y Verdún','Cisma y conquista otomana'],0,'Las presiones y entradas de distintos pueblos marcaron el periodo entre 395 y 476.'],
      ['¿Qué esquema resume mejor el paso a la Edad Media?',['Unidad → división → debilitamiento y presiones → caída de Occidente','División → unidad → expansión romana → Prehistoria','Caída de Oriente → Atila → unidad romana','Mare Nostrum → islam → 395'],0,'El cambio se entiende como una secuencia histórica de varios procesos conectados.']
    ]
  },
  {

    preguntas:[
      ['Un texto afirma: «En 395 desapareció el Imperio romano». ¿Cuál es la corrección más precisa?',['En 395 se dividió; Occidente cayó en 476 y Oriente continuó','En 395 cayó Oriente, pero Occidente continuó','En 395 comenzó la Edad Moderna','La frase es completamente correcta'],0,'395 marca la división, no la desaparición total del Imperio.'],
      ['Un alumno dice: «Los hunos eran un pueblo germánico que derribó directamente Roma en 476». ¿Qué falla?',['Los hunos ejercieron presión, pero no deben confundirse con los pueblos germánicos ni con una causa única','Solo falla la fecha 476','Solo falla el nombre de Atila','La afirmación es totalmente correcta'],0,'Los hunos impulsaron desplazamientos, pero el proceso fue más complejo que una conquista directa y única.'],
      ['¿Qué afirmación distingue mejor unidad y fragmentación?',['Mare Nostrum simboliza conexión; los asentamientos germánicos, pérdida de control occidental','Ambas expresiones significan lo mismo','La fragmentación ocurrió antes del Imperio romano','El Mediterráneo provocó por sí solo la caída'],0,'La conexión mediterránea contrasta con la posterior fragmentación de Occidente.'],
      ['¿Por qué es inexacto decir que «Roma cayó de repente»?',['Porque hubo división, debilitamiento, presiones y desplazamientos anteriores','Porque no existe ninguna fecha relacionada','Porque Oriente desapareció antes de 395','Porque los pueblos germánicos nunca entraron'],0,'La caída de Occidente culminó un proceso desarrollado durante décadas.'],
      ['Dos textos proponen causas: A) solo Atila; B) división, presión externa y asentamientos germánicos. ¿Cuál explica mejor el proceso?',['El texto B','El texto A','Los dos son igualmente completos','Ninguno menciona hechos del episodio'],0,'Una explicación multicausal refleja mejor el proceso histórico.'],
      ['¿Qué conclusión puede extraerse de que Oriente sobreviviera?',['La crisis afectó de forma diferente a las dos partes del Imperio','La división de 395 fue inventada','Occidente también siguió existiendo como antes','Los hunos controlaron las dos partes'],0,'Oriente y Occidente tuvieron evoluciones diferentes después de la división.'],
      ['¿Qué afirmación usa correctamente una fecha como referencia histórica?',['476 marca convencionalmente el inicio de la Edad Media, aunque el cambio fue progresivo','Toda Europa cambió completamente en un solo día de 476','La Edad Media comenzó antes de existir Roma','395 y 476 son intercambiables'],0,'Las fechas ayudan a organizar la historia, pero los cambios son procesos.'],
      ['¿Qué dato contradice la frase «en 476 desapareció todo el Imperio romano»?',['El Imperio romano de Oriente continuó existiendo','Atila dirigió a los hunos','El Mediterráneo se llamaba Mare Nostrum','La Edad Media duró siglos'],0,'La supervivencia de Oriente demuestra que la caída de 476 afectó a Occidente.'],
      ['¿Qué interpretación conecta mejor geografía e historia?',['El Mediterráneo facilitó la unidad; al perderse el control político, Occidente se fragmentó','El Mediterráneo impidió siempre los contactos','La geografía no tuvo ninguna relación con Roma','Los hunos llegaron por ser el Mediterráneo un océano'],0,'El mar favorecía las comunicaciones de un Imperio que después perdió cohesión política.'],
      ['¿Qué título sería más adecuado para un esquema con 395, hunos, germanos y 476?',['Del Imperio dividido a la caída de Occidente','El nacimiento del islam','La organización de Carlomagno','La Edad de Oro de Bizancio'],0,'Todos esos elementos explican el proceso que llevó a la caída de Occidente.']
    ]
  },
  {
    nivel:5, nombre:'Competencial avanzado', descripcion:'Resolver situaciones nuevas mediante razonamiento histórico.',
    preguntas:[

      ['Un mapa muestra dos áreas romanas desde 395 y varios movimientos hacia Occidente. ¿Qué leyenda sería más adecuada?',['División del Imperio y desplazamientos de pueblos','Cinco pilares del islam','Condados del Imperio carolingio','Cisma de Oriente'],0,'Los dos elementos del mapa corresponden al proceso estudiado en el Tema 1.'],

      ['¿Qué respuesta relaciona correctamente continuidad y cambio?',['Oriente continuó; Occidente cambió al fragmentarse en nuevos poderes','Las dos partes desaparecieron en 395','Occidente continuó sin cambios y Oriente cayó','No hubo continuidad alguna después de 476'],0,'Tras 476 hubo continuidad en Oriente y transformación política en Occidente.'],
      ['Una línea temporal deja un hueco: 395 → [hueco] → 476. ¿Qué contenido lo completa mejor?',['Presión de los hunos y desplazamientos/asentamientos germánicos','Coronación de Carlomagno','Hégira de Mahoma','Cisma de Oriente'],0,'Esos procesos conectan la división con la caída de Occidente.'],

      ['¿Qué información sería irrelevante para explicar la caída de Occidente según este tema?',['La organización de los condados carolingios','La división de 395','La presión de los hunos','Las entradas germánicas'],0,'Los condados carolingios pertenecen a un periodo posterior y a otro tema.'],

</script><script>
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;
function key(n){return `audiogela:t01:cast:nivel:${n}`};function renderLevels(){levels.innerHTML='';NIVELES_T01.forEach(n=>{const best=Number(localStorage.getItem(key(n.nivel))||0),b=document.createElement('button');b.className='level';b.innerHTML=`<span class="level-number">${n.nivel}</span><span><strong>${n.nombre}</strong><small>${n.descripcion}</small></span><span class="level-score">${best?`Mejor: ${best}/10`:'Sin realizar'}</span>`;b.onclick=()=>start(n);levels.appendChild(b)})}
function start(n){selected=n;questions=shuffle(n.preguntas);index=0;correct=0;menu.style.display='none';result.className='result';quiz.className='quiz show';document.getElementById('level-label').textContent=`NIVEL ${n.nivel} DE 5`;document.getElementById('level-title').textContent=n.nombre;renderQuestion()}
function renderQuestion(){answered=false;const item=questions[index],opts=shuffle(item[1].map((text,i)=>({text,ok:i===item[2]})));document.getElementById('counter').textContent=`Pregunta ${index+1} de ${questions.length}`;document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${index/questions.length*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>choose(o,b,item,box);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').className='next'}
function choose(o,b,item,box){if(answered)return;answered=true;[...box.children].forEach(x=>x.disabled=true);const right=[...box.children].find(x=>x.textContent===item[1][item[2]]);right.classList.add('correct');const f=document.getElementById('feedback');if(o.ok){correct++;f.className='feedback show ok';f.textContent='Correcto. '+item[3]}else{b.classList.add('wrong');f.className='feedback show bad';f.textContent='La respuesta correcta es: '+item[1][item[2]]+'. '+item[3]}document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${(index+1)/questions.length*100}%`;const next=document.getElementById('next');next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}
function finish(){quiz.className='quiz';result.className='result show';document.getElementById('result-level').textContent=`NIVEL ${selected.nivel} · ${selected.nombre.toUpperCase()}`;document.getElementById('score').textContent=`${correct}/10`;const passed=correct>=8;document.getElementById('result-title').textContent=passed?'Nivel superado':'Conviene repetir este nivel';document.getElementById('result-text').textContent=passed?'Has alcanzado el 80 %. Puedes continuar con el siguiente nivel.':'Vuelve a escuchar el episodio, revisa las explicaciones y repite el nivel.';const best=Math.max(Number(localStorage.getItem(key(selected.nivel))||0),correct);localStorage.setItem(key(selected.nivel),best);document.getElementById('best').textContent=`Mejor resultado de este nivel: ${best}/10`}
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()};document.getElementById('retry').onclick=()=>start(selected);document.getElementById('levels-button').onclick=()=>{result.className='result';menu.style.display='block';renderLevels()};renderLevels();
</script></body></html>
