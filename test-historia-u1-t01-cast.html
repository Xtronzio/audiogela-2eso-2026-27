</script><script>
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;

function selectQuestions(n){const queueKey=`audiogela:t01:cast:cola:v6:${n.nivel}`;let queued=[];try{queued=JSON.parse(localStorage.getItem(queueKey)||'[]')}catch(e){queued=[]}const valid=Array.isArray(queued)&&queued.length===10&&new Set(queued).size===10&&queued.every(i=>Number.isInteger(i)&&i>=0&&i<n.preguntas.length);if(valid){localStorage.removeItem(queueKey);return shuffle(queued.map(i=>n.preguntas[i]))}const groups={L:[],S:[],M:[]};n.preguntas.forEach((q,i)=>groups[lengthType(q)].push(i));Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));const chosen=[];Object.values(groups).forEach(g=>chosen.push(...g.splice(0,Math.floor(g.length/2))));const unused=shuffle(Object.values(groups).flat());while(chosen.length<10)chosen.push(unused.pop());const remaining=n.preguntas.map((_,i)=>i).filter(i=>!chosen.includes(i));localStorage.setItem(queueKey,JSON.stringify(remaining));return shuffle(chosen.map(i=>n.preguntas[i]))}
