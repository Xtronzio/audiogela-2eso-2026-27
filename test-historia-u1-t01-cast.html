  <style>
    :root{--blue:#0b438f;--pale:#eaf1fb;--text:#17324b;--muted:#607486;--line:#d6e0ec;--ok:#177548;--bad:#b83a3a}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#edf3f9);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:30px 0 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.back{color:var(--blue);text-decoration:none;font-weight:800}.brand{font-size:.76rem;color:var(--blue);font-weight:900;letter-spacing:.14em}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:0 18px 50px rgba(11,67,143,.1)}.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.12em;color:var(--blue)}h1{font-size:clamp(1.55rem,5vw,2.35rem);line-height:1.1;margin:8px 0}.intro{color:var(--muted);line-height:1.55;margin:0 0 24px}.progress-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:750}.progress{height:9px;background:#e7edf3;border-radius:999px;margin:8px 0 26px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--blue);transition:.25s}.question{font-size:1.22rem;line-height:1.4;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{width:100%;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-weight:700;line-height:1.35}.answer:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.answer:disabled{cursor:default}.answer.correct{border-color:var(--ok);background:#eaf7f1;color:#105c39}.answer.wrong{border-color:var(--bad);background:#fff0f0;color:#8b2525}.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#eaf7f1;color:#105c39}.feedback.bad{background:#fff0f0;color:#7f2828}.next{display:none;width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:850}.next.show{display:block}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:clamp(3rem,12vw,5.4rem);font-weight:950;letter-spacing:-.06em;color:var(--blue);margin:10px 0}.result h2{font-size:1.6rem;margin:0}.result p{color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.actions button,.actions a{border-radius:13px;padding:12px;text-align:center;text-decoration:none;font-weight:850}.retry{border:0;background:var(--blue);color:#fff}.home{border:1px solid var(--blue);background:#fff;color:var(--blue)}.best{margin-top:16px;font-size:.85rem;color:var(--muted)}@media(max-width:520px){.top{align-items:flex-start}.actions{grid-template-columns:1fr}}

<body>
<main class="wrap">
  <div class="top"><a class="back" href="index.html#historia-castellano-u1-t01">← AUDIO GELA</a><span class="brand">HISTORIA · CAST</span></div>
  <section class="card">
    <div id="quiz">
      <div class="eyebrow">UNIDAD 1 · TEMA 1</div><h1>¿Cómo comenzó la Edad Media?</h1><p class="intro">12 preguntas basadas únicamente en el contenido del podcast. Responde y lee la explicación antes de continuar.</p>
      <div class="progress-row"><span id="counter">Pregunta 1 de 12</span><span id="points">0 aciertos</span></div><div class="progress"><span id="bar"></span></div>
      <h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next" type="button">Siguiente pregunta</button>
    </div>
    <div class="result" id="result"><div class="eyebrow">RESULTADO</div><div class="score" id="score"></div><h2 id="result-title"></h2><p id="result-text"></p><div class="actions"><button class="retry" id="retry" type="button">Repetir test</button><a class="home" href="index.html#historia-castellano-u1-t01">Volver al tema</a></div><div class="best" id="best"></div></div>
  </section>
</main>
<script>
  const questions = [
    {q:'¿Qué nombre utilizaban los romanos para referirse al mar Mediterráneo?',a:['Mare Nostrum','Mare Germanicum','Océano Occidental','Mar de Atila'],c:0,e:'Mare Nostrum significa “nuestro mar”. El Mediterráneo era el gran espacio que comunicaba los territorios del Imperio romano.'},
    {q:'¿Qué función cumplía el Mediterráneo dentro del Imperio romano?',a:['Separaba completamente sus territorios','Comunicaba territorios y facilitaba los intercambios','Solo tenía una función militar','Marcaba la frontera con los hunos'],c:1,e:'El Mediterráneo actuaba como eje de comunicación y ayudaba a mantener unidos territorios muy extensos.'},
    {q:'¿Qué ocurrió con el Imperio romano en el año 395?',a:['Fue conquistado por Atila','Se dividió en Oriente y Occidente','Comenzó la Edad Moderna','Desapareció el Imperio de Oriente'],c:1,e:'En el año 395 el Imperio quedó dividido en dos partes: el Imperio romano de Oriente y el de Occidente.'},
    {q:'¿Qué parte del Imperio sobrevivió después del año 476?',a:['El Imperio romano de Oriente','El Imperio romano de Occidente','Ninguna de las dos','El reino de Atila'],c:0,e:'En 476 desapareció el Imperio romano de Occidente, pero el Imperio romano de Oriente continuó existiendo.'},
    {q:'¿Qué pueblo procedente de Asia presionó a otros pueblos para desplazarse hacia el territorio romano?',a:['Los egipcios','Los griegos','Los hunos','Los fenicios'],c:2,e:'El avance de los hunos provocó que distintos pueblos germánicos se desplazaran hacia las fronteras y el interior del Imperio.'},
    {q:'¿Quién fue el dirigente más conocido de los hunos?',a:['Justiniano','Atila','Rómulo Augústulo','Carlomagno'],c:1,e:'Atila fue el dirigente más conocido de los hunos y llegó a amenazar distintos territorios del Imperio romano.'},
    {q:'¿Cómo afectó el avance de los hunos a los pueblos germánicos?',a:['Los empujó hacia el Imperio romano','Los convirtió en romanos de inmediato','Detuvo todos sus movimientos','Los trasladó al norte de África'],c:0,e:'La presión de los hunos empujó a diversos pueblos germánicos hacia el territorio del Imperio romano.'},
    {q:'¿Qué consecuencia tuvieron las entradas de pueblos germánicos en el Imperio de Occidente?',a:['Reforzaron definitivamente el poder del emperador','Contribuyeron a su debilitamiento y fragmentación','Unificaron Oriente y Occidente','Crearon el Mare Nostrum'],c:1,e:'Las entradas e invasiones germánicas contribuyeron al debilitamiento y a la fragmentación del Imperio romano de Occidente.'},
    {q:'¿Qué sucedió en el año 476?',a:['El Imperio se dividió por primera vez','Cayó el Imperio romano de Occidente','Atila fundó Roma','Terminó la Edad Media'],c:1,e:'El año 476 se utiliza tradicionalmente para señalar la caída del Imperio romano de Occidente.'},
    {q:'¿Qué etapa histórica comenzó tradicionalmente con la caída del Imperio romano de Occidente?',a:['La Prehistoria','La Edad Antigua','La Edad Media','La Edad Contemporánea'],c:2,e:'La caída del Imperio romano de Occidente en 476 marca tradicionalmente el comienzo de la Edad Media.'},
    {q:'¿Cuál es el orden cronológico correcto?',a:['476 → presión de los hunos → división de 395','División de 395 → presión de los hunos y desplazamientos → caída de Occidente en 476','Caída de Occidente → división de 395 → Mare Nostrum','Atila → Mare Nostrum → creación del Imperio romano'],c:1,e:'Primero se produjo la división del Imperio en 395; después aumentaron las presiones y desplazamientos, y en 476 cayó el Imperio de Occidente.'},
    {q:'¿Cuál resume mejor el comienzo de la Edad Media?',a:['Fue un cambio causado por un único acontecimiento aislado','Fue el resultado de la división y el debilitamiento de Roma, las presiones externas y la caída de Occidente','Comenzó cuando Roma conquistó el Mediterráneo','Comenzó porque desapareció también el Imperio de Oriente'],c:1,e:'El paso a la Edad Media fue un proceso: división, debilitamiento, presión de hunos y germanos y, finalmente, caída del Imperio de Occidente.'}
  ];
  let index=0, correct=0, answered=false;
  const q=document.getElementById('question'), answers=document.getElementById('answers'), feedback=document.getElementById('feedback'), next=document.getElementById('next'), counter=document.getElementById('counter'), points=document.getElementById('points'), bar=document.getElementById('bar');
  function render(){answered=false;const item=questions[index];q.textContent=item.q;answers.innerHTML='';feedback.className='feedback';feedback.textContent='';next.className='next';counter.textContent=`Pregunta ${index+1} de ${questions.length}`;points.textContent=`${correct} ${correct===1?'acierto':'aciertos'}`;bar.style.width=`${(index/questions.length)*100}%`;item.a.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=text;b.addEventListener('click',()=>choose(i,b));answers.appendChild(b)});}
  function choose(choice,button){if(answered)return;answered=true;const item=questions[index];const buttons=[...answers.children];buttons.forEach(b=>b.disabled=true);buttons[item.c].classList.add('correct');if(choice===item.c){correct++;feedback.className='feedback show ok';feedback.textContent='Correcto. '+item.e}else{button.classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='La respuesta correcta es: '+item.a[item.c]+'. '+item.e}points.textContent=`${correct} ${correct===1?'acierto':'aciertos'}`;bar.style.width=`${((index+1)/questions.length)*100}%`;next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show';}
  function finish(){document.getElementById('quiz').style.display='none';const result=document.getElementById('result');result.className='result show';const percent=Math.round(correct/questions.length*100);document.getElementById('score').textContent=`${correct}/${questions.length}`;let title,text;if(percent>=85){title='Tema muy bien dominado';text='Comprendes los acontecimientos principales y su orden cronológico.'}else if(percent>=60){title='Buen trabajo, pero conviene repasar';text='Vuelve a escuchar el episodio y presta atención a las fechas y a la relación entre hunos, pueblos germánicos y caída de Occidente.'}else{title='Necesita otro repaso';text='Escucha de nuevo el episodio completo y después repite el test sin consultar las respuestas.'}document.getElementById('result-title').textContent=title;document.getElementById('result-text').textContent=text;const key='audiogela:test:historia-u1-t01-cast';const previous=Number(localStorage.getItem(key)||0);const best=Math.max(previous,correct);localStorage.setItem(key,best);document.getElementById('best').textContent=`Mejor resultado en este dispositivo: ${best}/${questions.length}`;}
  next.addEventListener('click',()=>{if(index<questions.length-1){index++;render()}else finish()});document.getElementById('retry').addEventListener('click',()=>{index=0;correct=0;document.getElementById('result').className='result';document.getElementById('quiz').style.display='block';render()});render();
</script>
