  <style>
    :root{--blue:#0b438f;--pale:#eaf1fb;--text:#17324b;--muted:#607486;--line:#d6e0ec;--ok:#177548;--bad:#b83a3a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#edf3f9);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:30px 0 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.back{color:var(--blue);text-decoration:none;font-weight:800}.brand{font-size:.76rem;color:var(--blue);font-weight:900;letter-spacing:.14em}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:0 18px 50px rgba(11,67,143,.1)}.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.12em;color:var(--blue)}h1{font-size:clamp(1.55rem,5vw,2.35rem);line-height:1.1;margin:8px 0}.intro{color:var(--muted);line-height:1.55;margin:0 0 24px}.progress-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:750}.progress{height:9px;background:#e7edf3;border-radius:999px;margin:8px 0 26px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--blue);transition:.25s}.question{font-size:1.22rem;line-height:1.4;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{width:100%;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-weight:700;line-height:1.35}.answer:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.answer:disabled{cursor:default}.answer.correct{border-color:var(--ok);background:#eaf7f1;color:#105c39}.answer.wrong{border-color:var(--bad);background:#fff0f0;color:#8b2525}.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#eaf7f1;color:#105c39}.feedback.bad{background:#fff0f0;color:#7f2828}.next{display:none;width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:850}.next.show{display:block}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:clamp(3rem,12vw,5.4rem);font-weight:950;letter-spacing:-.06em;color:var(--blue);margin:10px 0}.result h2{font-size:1.6rem;margin:0}.result p{color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.actions button,.actions a{border-radius:13px;padding:12px;text-align:center;text-decoration:none;font-weight:850}.retry{border:0;background:var(--blue);color:#fff}.home{border:1px solid var(--blue);background:#fff;color:var(--blue)}.best{margin-top:16px;font-size:.85rem;color:var(--muted)}@media(max-width:520px){.top{align-items:flex-start}.actions{grid-template-columns:1fr}}

<body><main class="wrap"><div class="top"><a class="back" href="index.html#historia-castellano-u1-t02">← AUDIO GELA</a><span class="brand">HISTORIA · CAST</span></div><section class="card">
  <div id="quiz"><div class="eyebrow">UNIDAD 1 · TEMA 2</div><h1>El Imperio bizantino</h1><p class="intro">12 preguntas basadas únicamente en el contenido del podcast. Responde y lee la explicación antes de continuar.</p><div class="progress-row"><span id="counter">Pregunta 1 de 12</span><span id="points">0 aciertos</span></div><div class="progress"><span id="bar"></span></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next" type="button">Siguiente pregunta</button></div>
  <div class="result" id="result"><div class="eyebrow">RESULTADO</div><div class="score" id="score"></div><h2 id="result-title"></h2><p id="result-text"></p><div class="actions"><button class="retry" id="retry" type="button">Repetir test</button><a class="home" href="index.html#historia-castellano-u1-t02">Volver al tema</a></div><div class="best" id="best"></div></div>
</section></main>
<script>
const questions=[
 {q:'¿De qué parte del antiguo Imperio romano surgió el Imperio bizantino?',a:['Del Imperio romano de Oriente','Del Imperio romano de Occidente','Del reino franco','Del Imperio carolingio'],c:0,e:'El Imperio bizantino fue la continuación del Imperio romano de Oriente, que sobrevivió a la caída de Occidente.'},
 {q:'¿Cuál fue la capital del Imperio bizantino?',a:['Roma','Atenas','Constantinopla','Toledo'],c:2,e:'Constantinopla fue la capital del Imperio bizantino. La ciudad se levantó sobre la antigua Bizancio.'},
 {q:'¿Qué relación existe entre Bizancio y Constantinopla?',a:['Eran dos imperios enemigos','Constantinopla se construyó sobre la antigua ciudad de Bizancio','Bizancio fue conquistada por Roma en 1453','No existe ninguna relación'],c:1,e:'La capital recibió el nombre de Constantinopla y se asentaba sobre la antigua ciudad griega de Bizancio.'},
 {q:'¿Por qué la posición de Constantinopla favoreció su economía?',a:['Porque estaba aislada de todas las rutas','Porque conectaba rutas comerciales entre Europa y Asia','Porque prohibía el comercio marítimo','Porque solo comerciaba con Roma'],c:1,e:'Su posición entre Europa y Asia convirtió Constantinopla en un importante centro de intercambio comercial.'},
 {q:'¿Qué emperador intentó recuperar parte de los antiguos territorios romanos de Occidente?',a:['Atila','Justiniano','Carlomagno','Odoacro'],c:1,e:'Justiniano impulsó un proyecto de restauración imperial y conquistó territorios que habían pertenecido al Imperio romano de Occidente.'},
 {q:'¿Cuál era el objetivo político de Justiniano?',a:['Dividir el Imperio de Oriente','Restaurar la antigua grandeza y unidad del Imperio romano','Trasladar la capital a Toledo','Entregar Constantinopla a los otomanos'],c:1,e:'Justiniano trató de restaurar la antigua grandeza romana y recuperar territorios occidentales.'},
 {q:'¿Qué actividad fue especialmente importante para la prosperidad bizantina?',a:['El comercio','La caza de los hunos','La piratería exclusivamente','La ausencia de intercambios'],c:0,e:'El comercio tuvo una importancia fundamental gracias a la posición estratégica del Imperio y de su capital.'},
 {q:'¿Qué significa que el Imperio bizantino se helenizó progresivamente?',a:['Que adoptó cada vez más la lengua y la cultura griegas','Que abandonó todas las ciudades','Que pasó a depender de Roma','Que fue conquistado por los francos'],c:0,e:'Con el paso del tiempo aumentó el predominio de la lengua y de la cultura griegas.'},
 {q:'¿Qué ocurrió en el Cisma de Oriente de 1054?',a:['Se dividió el Imperio romano en Oriente y Occidente','Se produjo la separación entre la Iglesia occidental y la oriental','Cayó Constantinopla ante los otomanos','Justiniano fue coronado emperador'],c:1,e:'En 1054 se consolidó la separación entre la Iglesia occidental, católica, y la Iglesia oriental, ortodoxa.'},
 {q:'¿Qué dos ramas del cristianismo quedaron separadas tras el Cisma de 1054?',a:['Católica y ortodoxa','Católica y musulmana','Ortodoxa y judía','Romana y germánica'],c:0,e:'El Cisma separó la Iglesia católica occidental y la Iglesia ortodoxa oriental.'},
 {q:'¿Cómo terminó el Imperio bizantino?',a:['Con la conquista otomana de Constantinopla','Con la caída de Roma en 476','Con el Tratado de Verdún','Con la invasión de Atila en 395'],c:0,e:'El Imperio terminó cuando los turcos otomanos conquistaron Constantinopla.'},
 {q:'¿Cuál es el orden cronológico correcto?',a:['Conquista otomana → Justiniano → Cisma de 1054','Justiniano → Cisma de 1054 → conquista otomana de Constantinopla','Cisma de 1054 → división de 395 → Justiniano','Justiniano → conquista otomana → Cisma de 1054'],c:1,e:'El proyecto de Justiniano fue anterior al Cisma de 1054, y la conquista otomana de Constantinopla ocurrió después.'}
];
let index=0,correct=0,answered=false;const q=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),counter=document.getElementById('counter'),points=document.getElementById('points'),bar=document.getElementById('bar');
function render(){answered=false;const item=questions[index];q.textContent=item.q;answers.innerHTML='';feedback.className='feedback';feedback.textContent='';next.className='next';counter.textContent=`Pregunta ${index+1} de ${questions.length}`;points.textContent=`${correct} ${correct===1?'acierto':'aciertos'}`;bar.style.width=`${index/questions.length*100}%`;item.a.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=text;b.addEventListener('click',()=>choose(i,b));answers.appendChild(b)})}
function choose(choice,button){if(answered)return;answered=true;const item=questions[index],buttons=[...answers.children];buttons.forEach(b=>b.disabled=true);buttons[item.c].classList.add('correct');if(choice===item.c){correct++;feedback.className='feedback show ok';feedback.textContent='Correcto. '+item.e}else{button.classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='La respuesta correcta es: '+item.a[item.c]+'. '+item.e}points.textContent=`${correct} ${correct===1?'acierto':'aciertos'}`;bar.style.width=`${(index+1)/questions.length*100}%`;next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}
function finish(){document.getElementById('quiz').style.display='none';const result=document.getElementById('result');result.className='result show';const percent=Math.round(correct/questions.length*100);document.getElementById('score').textContent=`${correct}/${questions.length}`;let title,text;if(percent>=85){title='Tema muy bien dominado';text='Comprendes la continuidad romana, la evolución cultural y las etapas principales del Imperio bizantino.'}else if(percent>=60){title='Buen trabajo, pero conviene repasar';text='Vuelve a escuchar el episodio y presta atención a Justiniano, la helenización, el Cisma y el final del Imperio.'}else{title='Necesita otro repaso';text='Escucha de nuevo el episodio completo y después repite el test sin consultar las respuestas.'}document.getElementById('result-title').textContent=title;document.getElementById('result-text').textContent=text;const key='audiogela:test:historia-u1-t02-cast',previous=Number(localStorage.getItem(key)||0),best=Math.max(previous,correct);localStorage.setItem(key,best);document.getElementById('best').textContent=`Mejor resultado en este dispositivo: ${best}/${questions.length}`}
next.addEventListener('click',()=>{if(index<questions.length-1){index++;render()}else finish()});document.getElementById('retry').addEventListener('click',()=>{index=0;correct=0;document.getElementById('result').className='result';document.getElementById('quiz').style.display='block';render()});render();
</script></body></html>
