Q('¿Qué frase utiliza correctamente la idea de cambio?',['El griego ganó peso mediante la helenización','La capital dejó de participar en el comercio','El Imperio pasó a ser un reino visigodo','Justiniano abandonó el modelo imperial romano'],0,'La helenización fue un cambio cultural.'),
Q('¿Qué título resume mejor el tema?',['Continuidad romana y evolución de Bizancio','Desaparición inmediata de todo el mundo romano','Formación de los primeros reinos germánicos','Nacimiento y expansión inicial del islam'],0,'El tema combina continuidad y transformación.'),

Q('¿Qué comparación entre Roma y Bizancio es válida?',['Bizancio heredó la tradición oriental romana','Roma fue fundada sobre Constantinopla','Bizancio perteneció al Imperio carolingio','Roma fue conquistada en el Cisma de 1054'],0,'El Imperio bizantino continuó la parte oriental.'),
Q('¿Qué relación no debe establecerse?',['Helenización como causa única del final imperial','Ubicación estratégica y actividad comercial','Justiniano y restauración de territorios','Cisma y separación entre las Iglesias'],0,'El final se relaciona con la conquista otomana, no con una causa cultural única.'),
Q('¿Qué dato funciona como evidencia de diversidad histórica?',['Herencia romana, lengua griega y cristianismo oriental','Una única cultura sin cambios durante siglos','Aislamiento completo respecto a otros territorios','Ausencia de transformaciones políticas o religiosas'],0,'Bizancio combinó elementos de distintas tradiciones.'),
Q('¿Qué corrección necesita «los católicos conquistaron Bizancio en 1054»?',['En 1054 hubo un Cisma, no una conquista','Los católicos eran los turcos otomanos','Justiniano dirigió aquella conquista final','La conquista ocurrió antes de la división romana'],0,'1054 corresponde a una separación religiosa.')
]},
{nivel:5,nombre:'Competencial avanzado',descripcion:'Resolver situaciones nuevas mediante razonamiento histórico.',preguntas:[
Q('Una fuente llama al emperador «sucesor de Roma» y usa griego. ¿Qué muestra?',['Continuidad romana y helenización','Desaparición completa de Roma','Dominio político de los francos','Conversión del Imperio al islam'],0,'La fuente combina herencia política romana y cultura griega.'),
Q('Un mapa sitúa la capital entre dos continentes y varias rutas. ¿Qué deduces?',['Tenía una posición comercial estratégica','Permanecía aislada de los intercambios','Dependía únicamente de la agricultura','Carecía de importancia para el Imperio'],0,'La posición explica su papel como centro comercial.'),
Q('Una moneda se presenta como romana y bizantina. ¿Qué concepto explica mejor esa doble identidad?',['Continuidad histórica','Ruptura absoluta','Aislamiento cultural','Conquista otomana'],0,'Bizancio se entendía como heredero de Roma.'),
Q('¿Qué evidencia apoyaría mejor el éxito económico de Constantinopla?',['Registros de mercancías de Europa y Asia','Un texto sobre la batalla de Poitiers','Una lista de reyes visigodos de Toledo','Un mapa de condados del Imperio carolingio'],0,'Las mercancías de ambos continentes evidencian intercambios.'),
Q('Hipótesis A: «Bizancio copió a Roma». Hipótesis B: «Continuó y se transformó». ¿Cuál es mejor?',['La B, porque integra herencia y helenización','La A, porque niega todos los cambios culturales','Las dos, porque rechazan la continuidad romana','Ninguna, porque Bizancio fue un reino germánico'],0,'Continuidad y cambio explican mejor su evolución.'),
Q('Si una fuente está escrita en griego siglos después, ¿qué proceso refleja?',['Helenización','Cisma','Reconquista','Ruralización'],0,'El uso creciente del griego refleja helenización.'),
Q('Un eje cronológico termina en la conquista de la capital. ¿Qué debe indicar?',['El final del Imperio bizantino','El comienzo del gobierno de Justiniano','La división del Imperio en el año 395','La aparición de la Iglesia católica'],0,'La conquista otomana puso fin a Bizancio.'),
Q('¿Qué argumento refuta que el Cisma destruyera inmediatamente el Imperio?',['Bizancio continuó hasta la conquista otomana','Justiniano gobernó después de la conquista final','La Iglesia occidental se hizo ortodoxa en 1054','Constantinopla dejó de comerciar tras el Cisma'],0,'El Imperio sobrevivió políticamente a la ruptura religiosa.'),
Q('¿Qué conclusión obtienes de que la capital tuviera varios nombres históricos?',['La ciudad acumuló etapas y herencias distintas','La ciudad cambió de continente varias veces','Bizancio y Constantinopla nunca se relacionaron','Cada nombre designaba un Imperio sin capital'],0,'Los nombres reflejan la continuidad histórica del lugar.'),
Q('Una respuesta dice solo «Justiniano conquistó». ¿Cómo mejorarla?',['Añadiendo que buscaba restaurar la unidad romana','Añadiendo que pretendía provocar el Cisma religioso','Indicando que conquistó la capital para los otomanos','Explicando que quería fundar el reino carolingio'],0,'Una explicación debe incluir el propósito de sus conquistas.'),
Q('¿Qué comparación permite distinguir influencia cultural y ruptura religiosa?',['Helenización frente a Cisma','Comercio frente a capital','Justiniano frente a Roma','Europa frente a Asia'],0,'La helenización es cultural; el Cisma, religioso.'),
Q('Si desaparecieran las rutas de intercambio, ¿qué ventaja perdería la capital?',['Su función como centro comercial','Su relación con la cultura griega','Su condición de sede religiosa','Su pasado como ciudad de Bizancio'],0,'Las rutas sostenían su importancia económica.'),
Q('¿Qué dato sería irrelevante para explicar el Cisma?',['La organización de los condados carolingios','La separación entre Oriente y Occidente','Las ramas católica y ortodoxa','La fecha histórica de 1054'],0,'Los condados carolingios pertenecen a otro tema.'),
Q('¿Qué titular distingue mejor hecho y consecuencia?',['1054: el Cisma separa las Iglesias','1054: Justiniano recupera Occidente','1054: los otomanos fundan Constantinopla','1054: cae el Imperio romano occidental'],0,'El titular relaciona correctamente fecha y proceso.'),
Q('¿Qué explicación evita confundir final religioso y final político?',['El Cisma separó Iglesias; la conquista acabó con el Imperio','El Cisma y la conquista fueron exactamente el mismo hecho','La conquista separó católicos y ortodoxos en 1054','Justiniano realizó tanto el Cisma como la conquista final'],0,'Distingue dos acontecimientos de naturaleza diferente.'),
Q('Una ciudad controla rutas entre continentes. ¿Qué efecto es más probable?',['Crecimiento de intercambios y riqueza','Desaparición completa de los mercados','Aislamiento respecto a otros territorios','Abandono de toda actividad urbana'],0,'El control de rutas favorece el comercio.'),
Q('¿Qué prueba mostraría mejor la política restauradora de Justiniano?',['Conquistas de antiguos territorios occidentales','Separación de católicos y ortodoxos','Uso creciente de la lengua griega','Conquista otomana de Constantinopla'],0,'Las recuperaciones territoriales apoyan su proyecto romano.'),
Q('¿Qué síntesis combina política, economía y cultura?',['Herencia romana, comercio estratégico y helenización','Reino germánico, aislamiento y cultura franca','Conquista islámica, agricultura y lengua árabe','Imperio carolingio, rutas atlánticas y latín'],0,'Resume tres dimensiones centrales de Bizancio.'),
Q('¿Qué síntesis combina religión y final político?',['Cisma en 1054 y posterior conquista otomana','Justiniano en 1054 y caída occidental posterior','Helenización religiosa y conquista de Roma','Unidad católica y restauración otomana'],0,'Distingue la ruptura religiosa del final imperial.'),
Q('Elige la conclusión más completa sobre Bizancio.',['Continuó Roma en Oriente, prosperó, se helenizó y terminó conquistado','Fue un reino germánico aislado que desapareció durante el Cisma','Nació con Justiniano y terminó cuando cayó Occidente en 476','Careció de comercio y mantuvo una cultura exclusivamente latina'],0,'Integra continuidad, economía, cultura y final político.')
]}
];
</script><script>
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;
function key(n){return `audiogela:t02:cast:nivel:${n}`};function renderLevels(){levels.innerHTML='';NIVELES_T02.forEach(n=>{const best=Number(localStorage.getItem(key(n.nivel))||0),b=document.createElement('button');b.className='level';b.innerHTML=`<span class="level-number">${n.nivel}</span><span><strong>${n.nombre}</strong><small>${n.descripcion}</small></span><span class="level-score">${best?`Mejor: ${best}/10`:'Sin realizar'}</span>`;b.onclick=()=>start(n);levels.appendChild(b)})}
function lengthType(q){const lengths=q[1].map(x=>x.length),value=lengths[q[2]],max=Math.max(...lengths),min=Math.min(...lengths);if(max===min)return'M';if(value===max)return'L';if(value===min)return'S';return'M'}
function selectQuestions(n){const queueKey=`audiogela:t02:cast:cola:v6:${n.nivel}`;let queued=[];try{queued=JSON.parse(localStorage.getItem(queueKey)||'[]')}catch(e){queued=[]}const valid=Array.isArray(queued)&&queued.length===10&&new Set(queued).size===10&&queued.every(i=>Number.isInteger(i)&&i>=0&&i<n.preguntas.length);if(valid){localStorage.removeItem(queueKey);return shuffle(queued.map(i=>n.preguntas[i]))}const groups={L:[],S:[],M:[]};n.preguntas.forEach((q,i)=>groups[lengthType(q)].push(i));Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));const chosen=[];Object.values(groups).forEach(g=>chosen.push(...g.splice(0,Math.floor(g.length/2))));const unused=shuffle(Object.values(groups).flat());while(chosen.length<10)chosen.push(unused.pop());const remaining=n.preguntas.map((_,i)=>i).filter(i=>!chosen.includes(i));localStorage.setItem(queueKey,JSON.stringify(remaining));return shuffle(chosen.map(i=>n.preguntas[i]))}
function start(n){selected=n;questions=selectQuestions(n);index=0;correct=0;menu.style.display='none';result.className='result';quiz.className='quiz show';document.getElementById('level-label').textContent=`NIVEL ${n.nivel} DE 5`;document.getElementById('level-title').textContent=n.nombre;renderQuestion()}
function renderQuestion(){answered=false;const item=questions[index],opts=shuffle(item[1].map((text,i)=>({text,ok:i===item[2]})));document.getElementById('counter').textContent=`Pregunta ${index+1} de ${questions.length}`;document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${index/questions.length*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>choose(o,b,item,box);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').className='next'}
function choose(o,b,item,box){if(answered)return;answered=true;[...box.children].forEach(x=>x.disabled=true);const right=[...box.children].find(x=>x.textContent===item[1][item[2]]);right.classList.add('correct');const f=document.getElementById('feedback');if(o.ok){correct++;f.className='feedback show ok';f.textContent='Correcto. '+item[3]}else{b.classList.add('wrong');f.className='feedback show bad';f.textContent='La respuesta correcta es: '+item[1][item[2]]+'. '+item[3]}document.getElementById('points').textContent=`${correct} aciertos`;document.getElementById('bar').style.width=`${(index+1)/questions.length*100}%`;const next=document.getElementById('next');next.textContent=index===questions.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}
function finish(){quiz.className='quiz';result.className='result show';document.getElementById('result-level').textContent=`NIVEL ${selected.nivel} · ${selected.nombre.toUpperCase()}`;document.getElementById('score').textContent=`${correct}/10`;const passed=correct>=8;document.getElementById('result-title').textContent=passed?'Nivel superado':'Conviene repetir este nivel';document.getElementById('result-text').textContent=passed?'Has alcanzado el 80 %. Puedes continuar con el siguiente nivel.':'Vuelve a escuchar el episodio, revisa las explicaciones y repite el nivel.';const best=Math.max(Number(localStorage.getItem(key(selected.nivel))||0),correct);localStorage.setItem(key(selected.nivel),best);document.getElementById('best').textContent=`Mejor resultado de este nivel: ${best}/10`}
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()};document.getElementById('retry').onclick=()=>start(selected);document.getElementById('levels-button').onclick=()=>{result.className='result';menu.style.display='block';renderLevels()};renderLevels();
</script></body></html>
