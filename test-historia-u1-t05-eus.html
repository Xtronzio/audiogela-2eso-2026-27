const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),levels=document.getElementById('levels');let selected,questions,index,correct,answered;
function key(n){return `audiogela:t05:eus:nivel:${n}`};function renderLevels(){levels.innerHTML='';NIVELES_T05_EUS.forEach(n=>{const best=Number(localStorage.getItem(key(n.nivel))||0),b=document.createElement('button');b.className='level';b.innerHTML=`<span class="level-number">${n.nivel}</span><span><strong>${n.nombre}</strong><small>${n.descripcion}</small></span><span class="level-score">${best?`Onena: ${best}/10`:'Egin gabe'}</span>`;b.onclick=()=>start(n);levels.appendChild(b)})}
function lengthType(q){const lengths=q[1].map(x=>x.length),value=lengths[q[2]],max=Math.max(...lengths),min=Math.min(...lengths);if(max===min)return'M';if(value===max)return'L';if(value===min)return'S';return'M'}
function selectQuestions(n){const queueKey=`audiogela:t05:eus:cola:v6:${n.nivel}`;let queued=[];try{queued=JSON.parse(localStorage.getItem(queueKey)||'[]')}catch(e){queued=[]}const valid=Array.isArray(queued)&&queued.length===10&&new Set(queued).size===10&&queued.every(i=>Number.isInteger(i)&&i>=0&&i<n.preguntas.length);if(valid){localStorage.removeItem(queueKey);return shuffle(queued.map(i=>n.preguntas[i]))}const groups={L:[],S:[],M:[]};n.preguntas.forEach((q,i)=>groups[lengthType(q)].push(i));Object.keys(groups).forEach(k=>groups[k]=shuffle(groups[k]));const chosen=[];Object.values(groups).forEach(g=>chosen.push(...g.splice(0,Math.floor(g.length/2))));const unused=shuffle(Object.values(groups).flat());while(chosen.length<10)chosen.push(unused.pop());const remaining=n.preguntas.map((_,i)=>i).filter(i=>!chosen.includes(i));localStorage.setItem(queueKey,JSON.stringify(remaining));return shuffle(chosen.map(i=>n.preguntas[i]))}
function start(n){selected=n;questions=selectQuestions(n);index=0;correct=0;menu.style.display='none';result.className='result';quiz.className='quiz show';document.getElementById('level-label').textContent=`MAILA ${n.nivel} / 5`;document.getElementById('level-title').textContent=n.nombre;renderQuestion()}
function renderQuestion(){answered=false;const item=questions[index],opts=shuffle(item[1].map((text,i)=>({text,ok:i===item[2]})));document.getElementById('counter').textContent=`${questions.length} galderatik ${index+1}.a`;document.getElementById('points').textContent=`${correct} zuzen`;document.getElementById('bar').style.width=`${index/questions.length*100}%`;document.getElementById('question').textContent=item[0];const box=document.getElementById('answers');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='answer';b.textContent=o.text;b.onclick=()=>choose(o,b,item,box);box.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').className='next'}
function choose(o,b,item,box){if(answered)return;answered=true;[...box.children].forEach(x=>x.disabled=true);const right=[...box.children].find(x=>x.textContent===item[1][item[2]]);right.classList.add('correct');const f=document.getElementById('feedback');if(o.ok){correct++;f.className='feedback show ok';f.textContent='Zuzena. '+item[3]}else{b.classList.add('wrong');f.className='feedback show bad';f.textContent='Erantzun zuzena hau da: '+item[1][item[2]]+'. '+item[3]}document.getElementById('points').textContent=`${correct} zuzen`;document.getElementById('bar').style.width=`${(index+1)/questions.length*100}%`;const next=document.getElementById('next');next.textContent=index===questions.length-1?'Emaitza ikusi':'Hurrengo galdera';next.className='next show'}
function finish(){quiz.className='quiz';result.className='result show';document.getElementById('result-level').textContent=`${selected.nivel}. MAILA · ${selected.nombre.toUpperCase()}`;document.getElementById('score').textContent=`${correct}/10`;const passed=correct>=8;document.getElementById('result-title').textContent=passed?'Maila gaindituta':'Maila hau errepikatzea komeni da';document.getElementById('result-text').textContent=passed?'Gutxienez % 80 lortu duzu. Hurrengo mailarekin jarrai dezakezu.':'Entzun berriro atala, berrikusi azalpenak eta errepikatu maila.';const best=Math.max(Number(localStorage.getItem(key(selected.nivel))||0),correct);localStorage.setItem(key(selected.nivel),best);document.getElementById('best').textContent=`Maila honetako emaitzarik onena: ${best}/10`}
document.getElementById('next').onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else finish()};document.getElementById('retry').onclick=()=>start(selected);document.getElementById('levels-button').onclick=()=>{result.className='result';menu.style.display='block';renderLevels()};renderLevels();
</script></body></html>
