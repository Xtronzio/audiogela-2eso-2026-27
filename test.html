<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B438F"><title>Test · AUDIO GELA</title><style>
:root{--blue:#0b438f;--pale:#eaf1fb;--text:#17324b;--muted:#607486;--line:#d6e0ec;--ok:#177548;--bad:#b83a3a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#edf3f9);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:30px 0 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.back{color:var(--blue);text-decoration:none;font-weight:800}.brand,.eyebrow{font-size:.76rem;color:var(--blue);font-weight:900;letter-spacing:.13em}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:0 18px 50px rgba(11,67,143,.1)}h1{font-size:clamp(1.55rem,5vw,2.35rem);line-height:1.1;margin:8px 0}.intro{color:var(--muted);line-height:1.55;margin:0 0 24px}.progress-row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:750}.progress{height:9px;background:#e7edf3;border-radius:999px;margin:8px 0 26px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);transition:.25s}.question{font-size:1.22rem;line-height:1.4;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{width:100%;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-weight:700;line-height:1.35}.answer:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.answer.correct{border-color:var(--ok);background:#eaf7f1;color:#105c39}.answer.wrong{border-color:var(--bad);background:#fff0f0;color:#8b2525}.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;line-height:1.5}.feedback.show{display:block}.feedback.ok{background:#eaf7f1;color:#105c39}.feedback.bad{background:#fff0f0;color:#7f2828}.next{display:none;width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:850}.next.show{display:block}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:clamp(3rem,12vw,5.4rem);font-weight:950;color:var(--blue);margin:10px 0}.result p{color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.actions button,.actions a{border-radius:13px;padding:12px;text-align:center;text-decoration:none;font-weight:850}.retry{border:0;background:var(--blue);color:#fff}.home{border:1px solid var(--blue);color:var(--blue)}.best{margin-top:16px;font-size:.85rem;color:var(--muted)}@media(max-width:520px){.actions{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><a class="back" id="back" href="index.html">← AUDIO GELA</a><span class="brand">HISTORIA · CAST</span></div><section class="card"><div id="quiz"><div class="eyebrow" id="label"></div><h1 id="title"></h1><p class="intro">12 preguntas basadas únicamente en el contenido del podcast. Responde y lee la explicación antes de continuar.</p><div class="progress-row"><span id="counter"></span><span id="points">0 aciertos</span></div><div class="progress"><span id="bar"></span></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Siguiente pregunta</button></div><div class="result" id="result"><div class="eyebrow">RESULTADO</div><div class="score" id="score"></div><h2 id="result-title"></h2><p id="result-text"></p><div class="actions"><button class="retry" id="retry">Repetir test</button><a class="home" id="home" href="index.html">Volver al tema</a></div><div class="best" id="best"></div></div></section></main><script src="temas-historia-cast.js"></script><script>
const id=new URLSearchParams(location.search).get('tema')||'t03',tema=TEMAS_HISTORIA_CAST[id];if(!tema)location.href='index.html';const anchor=`historia-castellano-u1-${id}`;document.title=`Test ${tema.numero} · ${tema.titulo} · AUDIO GELA`;document.getElementById('label').textContent=`UNIDAD 1 · TEMA ${Number(id.slice(1))}`;document.getElementById('title').textContent=tema.titulo;document.getElementById('back').href='index.html#'+anchor;document.getElementById('home').href='index.html#'+anchor;
let index=0,correct=0,answered=false;const q=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),counter=document.getElementById('counter'),points=document.getElementById('points'),bar=document.getElementById('bar');function render(){answered=false;const item=tema.quiz[index];q.textContent=item[0];answers.innerHTML='';feedback.className='feedback';next.className='next';counter.textContent=`Pregunta ${index+1} de ${tema.quiz.length}`;points.textContent=`${correct} ${correct===1?'acierto':'aciertos'}`;bar.style.width=`${index/tema.quiz.length*100}%`;item[1].forEach((text,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=text;b.onclick=()=>choose(i,b);answers.appendChild(b)})}function choose(choice,button){if(answered)return;answered=true;const item=tema.quiz[index],buttons=[...answers.children];buttons.forEach(b=>b.disabled=true);buttons[item[2]].classList.add('correct');if(choice===item[2]){correct++;feedback.className='feedback show ok';feedback.textContent='Correcto. '+item[3]}else{button.classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='La respuesta correcta es: '+item[1][item[2]]+'. '+item[3]}points.textContent=`${correct} aciertos`;bar.style.width=`${(index+1)/tema.quiz.length*100}%`;next.textContent=index===tema.quiz.length-1?'Ver resultado':'Siguiente pregunta';next.className='next show'}function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').className='result show';const pct=correct/tema.quiz.length*100;document.getElementById('score').textContent=`${correct}/${tema.quiz.length}`;document.getElementById('result-title').textContent=pct>=85?'Tema muy bien dominado':pct>=60?'Buen trabajo, pero conviene repasar':'Necesita otro repaso';document.getElementById('result-text').textContent=pct>=85?'Comprendes los conceptos y su relación histórica.':pct>=60?'Vuelve a escuchar el episodio y revisa las preguntas falladas.':'Escucha de nuevo el episodio completo y después repite el test.';const key=`audiogela:test:historia-u1-${id}-cast`,best=Math.max(Number(localStorage.getItem(key)||0),correct);localStorage.setItem(key,best);document.getElementById('best').textContent=`Mejor resultado en este dispositivo: ${best}/${tema.quiz.length}`}next.onclick=()=>{if(index<tema.quiz.length-1){index++;render()}else finish()};document.getElementById('retry').onclick=()=>{index=0;correct=0;document.getElementById('result').className='result';document.getElementById('quiz').style.display='block';render()};render();
</script></body></html>
